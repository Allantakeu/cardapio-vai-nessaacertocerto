<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./vn-data.js"></script>
  <style>
    :root{ --font-heading:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;--font-body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif; }
    body { margin:0; background:#ffffff; color:#17171b; font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
    a { color:#d81b84; text-decoration:none }
    a:hover { color:#b31569 }
    h2 { font-family:var(--font-heading); font-weight:600; font-size:19px; letter-spacing:-.02em; margin:0; text-wrap:balance }
    h3 { font-family:var(--font-heading); font-weight:600; font-size:13.5px; letter-spacing:-.01em; margin:0 0 5px }
    p { margin:0; font-size:14.5px; line-height:1.62; text-wrap:pretty; color:#2c2c33 }
    .num { font-variant-numeric:tabular-nums }
    .ui { font-family:var(--font-heading); font-weight:600; color:#17171b; background:rgba(23,23,27,.06); border-radius:4px; padding:1px 5px; white-space:nowrap }
    .step { display:grid; grid-template-columns:34px 1fr; gap:14px; align-items:start }
    .badge { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-heading); font-weight:600; font-size:12.5px; color:#9c7400; background:rgba(245,197,23,.22); box-shadow:inset 0 0 0 1px rgba(156,116,0,.3) }
    .note { font-size:13px; line-height:1.55; color:#63636c; background:#f7f5f1; border-radius:9px; padding:11px 13px }
    .warn { font-size:13.5px; line-height:1.55; color:#8c104f; background:rgba(216,27,132,.07); border-radius:9px; padding:12px 14px; box-shadow:inset 0 0 0 1px rgba(216,27,132,.16) }
    ul { margin:8px 0 0; padding-left:19px }
    li { font-size:14px; line-height:1.6; color:#2c2c33; margin-bottom:5px; text-wrap:pretty }
  </style>
</helmet>
<template data-dc-template>

<div style="min-height:100vh;display:flex;justify-content:center;background:radial-gradient(120% 45% at 50% 0%, #fffaf0 0%, #ffffff 55%)">
<div style="width:100%;max-width:560px;padding:30px 22px 90px">

  <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9c7400">
    <span style="width:18px;height:1px;background:#9c7400"></span>Vai Nessa · instalação
  </div>
  <h1 style="font-family:var(--font-heading);font-weight:700;font-size:31px;line-height:1.08;letter-spacing:-.035em;margin:14px 0 0">Ligar o cardápio ao Supabase</h1>
  <p style="margin-top:12px;color:#63636c">Depois disso, tudo que você mudar no painel aparece na hora para quem abrir o link do Instagram. Leva cerca de cinco minutos e não precisa cartão.</p>

  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px">
    <a href="https://supabase.com" target="_blank" style="display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 18px;border-radius:9px;white-space:nowrap;font-family:var(--font-heading);font-weight:600;font-size:14.5px;color:#d81b84;border:1px solid #d81b84;background:rgba(216,27,132,.06)">Abrir supabase.com ↗</a>
    <a href="painel.html" target="_blank" style="display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 18px;border-radius:9px;white-space:nowrap;font-family:var(--font-heading);font-weight:600;font-size:14.5px;color:#17171b;border:1px solid rgba(23,23,27,.22);background:#ffffff">Abrir o painel</a>
  </div>

  <div style="height:1px;background:rgba(23,23,27,.10);margin:26px 0"></div>

  <div style="display:flex;flex-direction:column;gap:26px">

    <div class="step">
      <div class="badge">1</div>
      <div>
        <h2>Criar a conta</h2>
        <p style="margin-top:7px">Entre em <a href="https://supabase.com" target="_blank">supabase.com</a> e toque em <span class="ui">Start your project</span>. Escolha <span class="ui">Continue with Google</span> (ou GitHub) e autorize com a sua conta.</p>
        <div class="note" style="margin-top:10px">O plano gratuito basta com folga: seu cardápio inteiro é um arquivo de poucos kilobytes. Ele não expira, mas se o projeto ficar 7 dias sem nenhum acesso o Supabase o coloca em pausa — como o cardápio é consultado todo dia, isso não acontece.</div>
      </div>
    </div>

    <div class="step">
      <div class="badge">2</div>
      <div>
        <h2>Criar o projeto</h2>
        <p style="margin-top:7px">No painel do Supabase, toque em <span class="ui">New project</span> e preencha:</p>
        <ul>
          <li><strong>Name:</strong> vainessa</li>
          <li><strong>Database Password:</strong> toque em <span class="ui">Generate a password</span> e guarde num lugar seguro. Você não vai precisar dela no cardápio, mas é a senha do seu banco.</li>
          <li><strong>Region:</strong> <span class="ui">South America (São Paulo)</span> — a mais próxima, o cardápio carrega mais rápido.</li>
          <li><strong>Pricing plan:</strong> deixe em <span class="ui">Free</span>.</li>
        </ul>
        <p style="margin-top:9px">Toque em <span class="ui">Create new project</span> e espere de um a dois minutos até parar de aparecer "Setting up project".</p>
      </div>
    </div>

    <div class="step">
      <div class="badge">3</div>
      <div>
        <h2>Criar a tabela do cardápio</h2>
        <p style="margin-top:7px">No menu da esquerda, abra <span class="ui">SQL Editor</span> e toque em <span class="ui">New query</span>. Copie o código abaixo, cole na área branca e toque em <span class="ui">Run</span> (ou Ctrl+Enter).</p>
        <pre class="num" style="margin:12px 0 0;padding:13px;background:#17171b;color:#e9e9ed;border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.65;overflow-x:auto">{{ sql }}</pre>
        <button onClick="{{ onCopy }}" style="margin-top:10px;display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 18px;border-radius:9px;white-space:nowrap;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:14.5px;color:#d81b84;border:1px solid #d81b84;background:rgba(216,27,132,.06)">{{ copyLabel }}</button>
        <p style="margin-top:11px">Deve aparecer <span class="ui">Success. No rows returned</span>. É o resultado certo — a tabela nasce vazia; o painel preenche sozinho no passo 5.</p>
      </div>
    </div>

    <div class="step">
      <div class="badge">4</div>
      <div>
        <h2>Copiar o endereço e a chave</h2>
        <p style="margin-top:7px">No menu da esquerda, desça até a engrenagem <span class="ui">Project Settings</span> e abra <span class="ui">API</span>. Você precisa de dois valores:</p>
        <ul>
          <li><strong>Project URL</strong> — parece <span class="num">https://abcdefgh.supabase.co</span></li>
          <li><strong>anon public</strong> — uma chave bem longa que começa com <span class="num">eyJ</span>. Toque no ícone de copiar ao lado dela.</li>
        </ul>
        <div class="warn" style="margin-top:11px">Nunca use nem envie a chave <strong>service_role</strong>, que aparece logo abaixo. Ela dá poder total sobre o banco. A do cardápio é sempre a <strong>anon public</strong>.</div>
      </div>
    </div>

    <div class="step">
      <div class="badge">5</div>
      <div>
        <h2>Criar o seu login</h2>
        <p style="margin-top:7px">No menu da esquerda, abra <span class="ui">Authentication</span> → <span class="ui">Users</span> e toque em <span class="ui">Add user</span>. Preencha seu e-mail e uma senha, e marque <span class="ui">Auto Confirm User</span> (senão o Supabase manda um e-mail de confirmação antes de liberar o login).</p>
        <div class="warn" style="margin-top:11px">É esse e-mail e senha que abrem o painel a partir de agora — não existe mais PIN. Guarde bem, é a única conta.</div>
      </div>
    </div>

    <div class="step">
      <div class="badge">6</div>
      <div>
        <h2>Conectar no painel</h2>
        <p style="margin-top:7px">Abra o <a href="painel.html" target="_blank">painel admin</a>. Na tela de login, toque em <span class="ui">Conectar em outro Supabase</span>, cole a <strong>Project URL</strong> no primeiro campo, a <strong>chave anon</strong> no segundo e toque em <span class="ui">Salvar e recarregar</span> — isso só troca pra onde o painel aponta, ainda sem precisar logar.</p>
        <p style="margin-top:9px">Depois de recarregar, entre com o e-mail e a senha que você criou no passo 5. Se der tudo certo, o painel abre e o selo no topo mostra <span class="ui">Ao vivo</span>. As suas 16 cervejas sobem para o banco assim que você salvar qualquer alteração.</p>
      </div>
    </div>

    <div class="step">
      <div class="badge">7</div>
      <div>
        <h2>Testar de verdade</h2>
        <p style="margin-top:7px">Abra a vitrine no seu celular e o painel no computador. Mude o preço de uma cerveja no painel, espere uns 15 segundos e olhe o celular: o preço muda sem recarregar. Marcar um produto como <span class="ui">Esgotado</span> some com ele da vitrine na hora seguinte.</p>
        <p style="margin-top:9px">O painel te mantém logado entre visitas (a sessão renova sozinha). Pra sair de um aparelho compartilhado, use o botão <span class="ui">Sair</span> no topo.</p>
      </div>
    </div>

  </div>

  <div style="height:1px;background:rgba(23,23,27,.10);margin:30px 0 24px"></div>

  <h2 style="font-size:15px">Se algo der errado</h2>
  <div style="display:flex;flex-direction:column;gap:16px;margin-top:14px">
    <div>
      <h3>Aparece "Falhou: 404"</h3>
      <p style="font-size:13.5px;color:#63636c">A tabela não foi criada. Volte ao passo 3 e confira se o <span class="ui">Run</span> respondeu Success.</p>
    </div>
    <div>
      <h3>Aparece "Falhou: 401" ou "Invalid API key"</h3>
      <p style="font-size:13.5px;color:#63636c">Duas causas possíveis: a chave veio incompleta (copie a <strong>anon public</strong> inteira pelo botão de copiar do Supabase, sem espaços no começo ou no fim) — ou você não está logado. Gravar no cardápio exige login (passo 5); sem sessão, só a leitura funciona.</p>
    </div>
    <div>
      <h3>Não consigo logar no painel</h3>
      <p style="font-size:13.5px;color:#63636c">Confira se o usuário foi criado em <span class="ui">Authentication → Users</span> (passo 5) e se <span class="ui">Auto Confirm User</span> estava marcado — sem isso, o Supabase espera você confirmar o e-mail antes de deixar logar.</p>
    </div>
    <div>
      <h3>Aparece "relation vn_catalog already exists"</h3>
      <p style="font-size:13.5px;color:#63636c">A tabela já existia. Está tudo certo, siga para o passo 4.</p>
    </div>
    <div>
      <h3>O selo continua em "Neste aparelho"</h3>
      <p style="font-size:13.5px;color:#63636c">A URL provavelmente está com barra sobrando ou faltando o https://. Ela termina em <span class="num">.supabase.co</span> e nada depois disso.</p>
    </div>
    <div>
      <h3>Editei sem internet</h3>
      <p style="font-size:13.5px;color:#63636c">O painel salva no aparelho e o selo cai para "Neste aparelho". Ao voltar a conexão, abra o painel e faça qualquer edição: ela envia tudo de novo para o banco.</p>
    </div>
  </div>

  <div class="warn" style="margin-top:26px">
    <strong style="font-family:var(--font-heading)">Sobre segurança.</strong> A leitura do cardápio é pública (qualquer cliente precisa ver a vitrine sem logar), mas gravar — mudar produto, preço, configurações ou enviar foto — exige estar logado com o e-mail e senha do passo 5. A chave anon, que fica visível no navegador, nunca sozinha basta pra escrever: quem decide isso são as policies de RLS do SQL do passo 3, não a chave. Os eventos de clique/venda/pedido (que guardam nome, telefone e endereço de cliente) só podem ser lidos por quem está logado, pelo mesmo motivo.
  </div>

  <p style="margin-top:24px;font-size:13px;color:#7c7c86">Guarde uma cópia do cardápio de vez em quando: <span class="ui">Conexão → Baixar JSON</span>.</p>

</div>
</div>

</template>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { copied: false };

  renderVals() {
    const sql = (window.VN && VN.sql) || '';
    return {
      sql: sql,
      copyLabel: this.state.copied ? 'SQL copiado ✓' : 'Copiar SQL',
      onCopy: () => {
        navigator.clipboard.writeText(sql).then(() => {
          this.setState({ copied: true });
          clearTimeout(this._t);
          this._t = setTimeout(() => this.setState({ copied: false }), 2200);
        });
      }
    };
  }

  componentWillUnmount() { clearTimeout(this._t); }
}

</script>
</body>
</html>
