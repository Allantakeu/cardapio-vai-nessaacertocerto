<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon.png" type="image/png">
<script src="./support.js"></script>
<script src="./dc-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap">
<script src="image-slot.js"></script>
<script src="./vn-data.js"></script>
<style>
:root{
  --font-heading:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --color-bg:#ffffff;--color-surface:#f7f5f1;--color-text:#17171b;
  --color-accent:#d81b84;--color-accent-100:#8c104f;--color-accent-200:#fbd0e6;
  --color-accent-300:#f291c3;--color-accent-400:#e8579f;--color-accent-500:#d81b84;
  --color-accent-600:#b31569;--color-accent-700:#8c104f;--color-accent-800:#5d0a35;--color-accent-900:#33061d;
  --color-neutral-300:#a3a3ac;--color-neutral-400:#7c7c86;--color-neutral-500:#63636c;--color-neutral-600:#63636c;--color-neutral-700:#d8d6d1;
  --color-divider:rgba(23,23,27,.14);
  --gold:#f5c517;--gold-ink:#9c7400;
  --brand-2:#e6208c;--brand-2-soft:rgba(230,32,140,.10);--brand-2-text:#c11570;
  --line:rgba(23,23,27,.10);
  --shadow-sm:0 0 0 1px rgba(23,23,27,.08);
  --shadow-md:0 0 0 1px rgba(23,23,27,.08), 0 6px 18px rgba(23,23,27,.10);
  --shadow-lg:0 0 0 1px rgba(23,23,27,.08), 0 16px 40px rgba(23,23,27,.16);
}
body{margin:0;background:#ffffff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv05","ss03","kern";font-optical-sizing:auto}
h1,h2,h3,h4,h5,h6{font-feature-settings:"cv05","ss03","kern";text-wrap:balance}
p,.clamp2{text-wrap:pretty}
.eyebrow{font-family:var(--font-heading);font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","kern";letter-spacing:-.01em}
.sect{font-family:var(--font-heading);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.itemname{font-family:var(--font-heading);font-weight:600;font-size:15.5px;letter-spacing:-.012em;line-height:1.25}
.desc{font-size:12.5px;line-height:1.5;color:var(--color-neutral-500);text-wrap:pretty;letter-spacing:.002em}
a{color:var(--color-accent);text-decoration:none}
.card{display:flex;flex-direction:column;background:#fff;border-radius:11px;padding:10px;gap:8px}
.elev-sm{box-shadow:var(--shadow-sm)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-family:var(--font-heading);font-weight:600;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-block{width:100%}
.btn-primary{border:1px solid var(--color-accent);color:var(--color-accent);background:rgba(216,27,132,.08)}
.btn-secondary{border:1px solid var(--line);color:var(--color-text);background:var(--color-surface)}
.btn-ghost{border:1px solid var(--line);border-radius:50%;color:var(--color-text);background:transparent}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--font-heading);font-weight:500;font-size:12px;color:var(--color-neutral-500)}
.input{width:100%;box-sizing:border-box;height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--color-surface);font-size:14px;color:var(--color-text)}
.input::placeholder{color:var(--color-neutral-400)}
.input:focus-visible{outline:2px solid var(--color-accent);outline-offset:-1px;border-color:var(--color-accent)}
a:hover{color:var(--color-accent-300)}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideInRight{from{transform:translateX(28px);opacity:.35}to{transform:none;opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-28px);opacity:.35}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes skelPulse{0%,100%{opacity:.6}50%{opacity:1}}
.skel{background:rgba(23,23,27,.09);animation:skelPulse 1.3s ease-in-out infinite}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.noscroll::-webkit-scrollbar{height:0;width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:481px){
  body{background:#e7e4dc}
  .vn-frame{margin:28px 0;border-radius:26px;box-shadow:0 24px 60px rgba(23,23,27,.22), 0 0 0 1px rgba(23,23,27,.07);overflow:hidden}
}
</style>
</helmet>
<template data-dc-template>
<div style="min-height:100vh;display:flex;justify-content:center;font-family:var(--font-body);color:var(--color-text);{{ accentVars }}">
<div class="vn-frame" style="width:100%;max-width:440px;position:relative;padding-bottom:112px;background:radial-gradient(130% 55% at 50% 0%, #fffaf0 0%, #ffffff 60%)">

  <sc-if value="{{ !loaded }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;height:128px" class="skel"></div>
    <div style="padding:8px 20px 18px;margin-top:-34px">
      <div style="width:92px;height:92px;border-radius:50%;box-shadow:0 0 0 3px #fff" class="skel"></div>
      <div style="width:150px;height:21px;border-radius:6px;margin-top:14px" class="skel"></div>
      <div style="width:210px;height:12px;border-radius:6px;margin-top:10px" class="skel"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <div style="width:96px;height:26px;border-radius:999px" class="skel"></div>
        <div style="width:120px;height:26px;border-radius:999px" class="skel"></div>
      </div>
      <div style="width:100%;height:46px;border-radius:10px;margin-top:16px" class="skel"></div>
    </div>
    <div style="padding:0 18px">
      <div style="width:100%;height:44px;border-radius:11px" class="skel"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <div style="width:64px;height:32px;border-radius:999px" class="skel"></div>
        <div style="width:84px;height:32px;border-radius:999px" class="skel"></div>
        <div style="width:76px;height:32px;border-radius:999px" class="skel"></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
        <div style="width:92px;height:92px;border-radius:11px;flex:none" class="skel"></div>
        <div style="flex:1">
          <div style="width:70%;height:15px;border-radius:5px" class="skel"></div>
          <div style="width:90%;height:11px;border-radius:5px;margin-top:8px" class="skel"></div>
          <div style="width:60px;height:20px;border-radius:6px;margin-top:9px" class="skel"></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
        <div style="width:92px;height:92px;border-radius:11px;flex:none" class="skel"></div>
        <div style="flex:1">
          <div style="width:70%;height:15px;border-radius:5px" class="skel"></div>
          <div style="width:90%;height:11px;border-radius:5px;margin-top:8px" class="skel"></div>
          <div style="width:60px;height:20px;border-radius:6px;margin-top:9px" class="skel"></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
        <div style="width:92px;height:92px;border-radius:11px;flex:none" class="skel"></div>
        <div style="flex:1">
          <div style="width:70%;height:15px;border-radius:5px" class="skel"></div>
          <div style="width:90%;height:11px;border-radius:5px;margin-top:8px" class="skel"></div>
          <div style="width:60px;height:20px;border-radius:6px;margin-top:9px" class="skel"></div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ loaded }}" hint-placeholder-val="{{ true }}">

  <sc-if value="{{ showSwitcher }}" hint-placeholder-val="{{ false }}">
  <div class="eyebrow" style="display:flex;align-items:center;gap:9px;padding:10px 18px 0;color:var(--color-neutral-600)">
    <span>Ficha do item</span>
    <div class="noscroll" style="display:flex;gap:6px;overflow-x:auto">
      <sc-for list="{{ variants }}" as="v" hint-placeholder-count="3">
        <button onClick="{{ v.onClick }}" style="{{ v.style }}">{{ v.name }}</button>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <div style="position:relative">
    <div style="width:100%;height:128px;overflow:hidden;background:var(--color-surface)">
      <image-slot id="vn-cover" shape="rect" style="width:100%;height:100%" placeholder="Capa da loja" src="{{ coverUrl }}"></image-slot>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(23,23,27,0) 55%, rgba(23,23,27,.30))"></div>
    </div>
  </div>
  <div style="position:relative;padding:8px 20px 18px;margin-top:-34px;background:radial-gradient(120% 100% at 18% 40%, rgba(245,197,23,.10), transparent 60%)">
    <div style="position:relative;display:flex;align-items:flex-end;gap:16px">
      <div style="width:92px;height:92px;flex:none;border-radius:50%;padding:4px;background:linear-gradient(160deg, rgba(245,197,23,.65), rgba(230,32,140,.45));box-shadow:0 10px 24px rgba(23,23,27,.16)">
        <div style="width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 3px #fff">
          <image-slot id="vn-logo" shape="circle" style="width:100%;height:100%" placeholder="Logo" src="{{ logoUrl }}"></image-slot>
        </div>
      </div>
      <div style="min-width:0;flex:1;padding-bottom:2px">
        <div class="eyebrow" style="display:flex;align-items:center;gap:7px;color:var(--gold-ink)">
          <span style="width:5px;height:5px;border-radius:50%;background:var(--gold-ink)"></span>Adega
        </div>
        <div style="font-family:var(--font-heading);font-weight:700;font-size:25px;line-height:1.08;letter-spacing:-.03em;margin-top:6px;color:var(--color-text);text-wrap:balance">
          <span style="color:var(--gold-ink)">{{ storeNamePart1 }}</span> <span style="color:var(--brand-2-text)">{{ storeNamePart2 }}</span>
        </div>
      </div>
      <div style="flex:none;display:flex;gap:8px;padding-bottom:4px">
        <a href="https://www.instagram.com/vai.nessa1.0__/" target="_blank" rel="noopener" aria-label="Instagram" style="width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-sm);color:var(--color-text)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </a>
        <button onClick="{{ onShare }}" aria-label="Compartilhar" style="width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-sm);color:var(--color-text);cursor:pointer;border:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
      </div>
    </div>
    <div class="desc" style="margin-top:12px;line-height:1.55">{{ tagline }}</div>
    <div style="position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">
      <span style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:11.5px;color:#3a3a42;background:#fff;box-shadow:var(--shadow-sm)">
        <span style="width:6px;height:6px;border-radius:50%;background:#39d98a;box-shadow:0 0 8px #39d98a"></span>{{ hoursLabel }}
      </span>
      <span style="border-radius:999px;padding:7px 12px;font-size:11.5px;color:#3a3a42;background:#fff;box-shadow:var(--shadow-sm)">{{ minutesLabel }}</span>
      <span style="border-radius:999px;padding:7px 12px;font-size:11.5px;color:#3a3a42;background:#fff;box-shadow:var(--shadow-sm)">{{ paymentsLabel }}</span>
    </div>
    <div style="position:relative;display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 10px;border-radius:10px;background:rgba(245,197,23,.1);box-shadow:inset 0 0 0 1px rgba(156,116,0,.22)">
      <span style="width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#6f5200;background:rgba(245,197,23,.3)">◆</span>
      <span style="flex:1;min-width:0;font-size:12px;line-height:1.3;letter-spacing:-.005em;color:var(--color-text)"><span style="font-family:var(--font-heading);font-weight:600">{{ addr1 }}</span> <span style="font-size:11px;color:var(--color-neutral-500)">· {{ addr2 }}</span></span>
      <a href="{{ mapHref }}" target="_blank" style="flex:none;font-size:11px;font-family:var(--font-heading);font-weight:500;color:var(--color-accent);white-space:nowrap">Ver no mapa</a>
    </div>
  </div>

  <div style="padding:10px 18px 6px">
    <input class="input" type="text" placeholder="Buscar bebida" value="{{ q }}" onChange="{{ onSearch }}">
  </div>
  <div id="vn-chips-bar" style="position:sticky;top:0;z-index:20;padding:8px 18px 12px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)">
    <div style="position:relative">
      <div class="noscroll" style="display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px;touch-action:pan-x">
        <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
          <button onClick="{{ tab.onClick }}" style="scroll-snap-align:start;{{ tab.style }}">{{ tab.name }}</button>
        </sc-for>
      </div>
      <div style="position:absolute;top:0;right:0;bottom:2px;width:28px;pointer-events:none;background:linear-gradient(to right, transparent, rgba(255,255,255,.96))"></div>
    </div>
  </div>

  <sc-if value="{{ showFeatured }}" hint-placeholder-val="{{ false }}">
  <div style="padding:4px 0 0">
    <div style="display:flex;align-items:center;gap:8px;padding:0 18px 8px">
      <h6 class="sect" style="margin:0;font-size:10.5px;color:var(--brand-2-text)">Promoções da semana</h6>
      <span style="flex:1;height:1px;background:linear-gradient(to right, var(--line), transparent)"></span>
      <button onClick="{{ promoPrev }}" aria-label="Anterior" style="width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--color-accent)">‹</button>
      <button onClick="{{ promoNext }}" aria-label="Próxima" style="width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--color-accent)">›</button>
    </div>
    <div ref="{{ promoTrack }}" onScroll="{{ onPromoScroll }}" class="noscroll" style="display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 18px 8px;overscroll-behavior-x:contain;touch-action:none">
      <sc-for list="{{ promos }}" as="p" hint-placeholder-count="3">
        <div onClick="{{ p.onOpen }}" class="card elev-sm" style="width:154px;flex:none;scroll-snap-align:start;padding:0;overflow:hidden;cursor:pointer;gap:0;background:var(--color-surface)">
          <div style="position:relative">
            <image-slot id="{{ p.slotId }}" shape="rect" style="width:100%;height:114px" placeholder="Foto da promo" src="{{ p.photoUrl }}"></image-slot>
            <span style="position:absolute;top:6px;left:6px;pointer-events:none;background:var(--brand-2);color:#fff;font-family:var(--font-heading);font-weight:600;font-size:7.5px;letter-spacing:.08em;padding:3px 6px;border-radius:999px">{{ p.tagLabel }}</span>
          </div>
          <div style="padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px">
            <div class="itemname" style="font-size:12px;line-height:1.25">{{ p.name }}</div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
              <span class="money" style="font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:-.02em;color:var(--color-accent)">{{ p.priceLabel }}</span>
              <span style="flex:1"></span>
              <button onClick="{{ p.onAdd }}" aria-label="Adicionar" style="flex:none;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--color-accent);color:var(--color-accent);background:rgba(216,27,132,.08)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
            </div>
          </div>
        </div>
      </sc-for>
      <div ref="{{ promoSpacer }}" style="flex:none;width:0px"></div>
    </div>
    <div style="display:flex;justify-content:center;align-items:center;gap:5px;padding:0 18px 4px">
      <sc-for list="{{ promoDots }}" as="d" hint-placeholder-count="3">
        <button onClick="{{ d.onClick }}" aria-label="Ir para promoção" style="{{ d.style }}"></button>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <div key="{{ cat }}" style="{{ groupsAnimStyle }}padding:14px 18px 0">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="margin-bottom:22px">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
          <span style="width:4px;height:14px;border-radius:2px;background:var(--gold-ink);flex:none"></span>
          <h6 class="sect" style="margin:0;color:var(--gold-ink)">{{ g.name }}</h6>
          <span style="flex:1;height:1px;background:linear-gradient(to right, var(--line), transparent)"></span>
          <span style="font-size:11px;color:var(--color-neutral-600)">{{ g.count }}</span>
        </div>
        <sc-for list="{{ g.items }}" as="item" hint-placeholder-count="4">
          <div onClick="{{ item.onOpen }}" style="display:flex;gap:14px;align-items:flex-start;padding:14px 0;cursor:pointer;border-bottom:1px solid var(--line)" style-hover="background:rgba(23,23,27,.035)">
            <image-slot id="{{ item.slotId }}" shape="rounded" radius="11" style="width:92px;height:92px;flex:none;box-shadow:0 0 0 1px rgba(23,23,27,.06)" placeholder="Foto" src="{{ item.photoUrl }}"></image-slot>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
                <span class="itemname">{{ item.name }}</span>
                <sc-if value="{{ item.tag }}" hint-placeholder-val="{{ false }}">
                  <span style="font-family:var(--font-heading);font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--brand-2-soft);color:var(--brand-2-text)">{{ item.tag }}</span>
                </sc-if>
              </div>
              <div class="clamp2 desc" style="margin-top:4px">{{ item.desc }}</div>
              <div class="money" style="display:inline-flex;align-items:center;margin-top:8px;font-family:var(--font-heading);font-weight:600;font-size:13px;padding:3px 9px;border-radius:6px;color:#6f5200;background:rgba(245,197,23,.2);box-shadow:inset 0 0 0 1px rgba(156,116,0,.28)">{{ item.priceLabel }}</div>
            </div>
            <sc-if value="{{ !item.rowQty }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ item.onQuickAdd }}" aria-label="Adicionar" style="{{ item.plusStyle }};cursor:pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
            </sc-if>
            <sc-if value="{{ item.rowQty }}" hint-placeholder-val="{{ false }}">
              <div onClick="{{ stop }}" style="flex:none;margin-top:24px;display:flex;align-items:center;gap:1px;border:1px solid var(--line);border-radius:9px;padding:2px">
                <button class="btn btn-ghost" onClick="{{ item.onRowDec }}" style="width:25px;height:25px;padding:0;font-size:14px">−</button>
                <span style="min-width:17px;text-align:center;font-size:12px;font-weight:600">{{ item.rowQty }}</span>
                <button class="btn btn-ghost" onClick="{{ item.onRowInc }}" style="width:25px;height:25px;padding:0;font-size:14px">+</button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>

    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="padding:40px 0;text-align:center;color:var(--color-neutral-500);font-size:13.5px">Nada encontrado com esse nome.</div>
    </sc-if>

    <div style="padding:8px 0 20px;font-size:11.5px;line-height:1.65;letter-spacing:.005em;color:var(--color-neutral-600)">
      Pedidos pelo WhatsApp (11) 99934-7715 · @vai.nessa1.0__<br>Venda proibida para menores de 18 anos. Imagens ilustrativas.
    </div>

   por isso ele começa lendo o que sobrou salvo no aparelho do cliente. */
function loadCart() {
  try {
    const saved = JSON.parse(localStorage.getItem('vn.cart'));
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}

class Component extends DCLogic {
  state = { doc: null, telefone: '', cat: 'Todos', q: '', open: null, qty: 1, opt: 0, sel: {}, obs: '', cart: loadCart(), cartOpen: false, done: false, mode: 'entrega', nome: '', cep: '', rua: '', numero: '', bairro: '', cepStatus: 'idle', addrEdit: false, msg: '', toast: '', variant: null, added: '', addedLineIndex: null, deliveryKm: null, deliveryFeeCalc: null, deliveryCalcStatus: 'idle', promoIdx: 0 };

  get data() {
    const d = this.state.doc;
    if (!d) return [];
    return d.categories
      .map(c => ({ name: c.name, items: d.products.filter(p => p.catId === c.id && !p.out) }))
      .filter(g => g.items.length);
  }

  get extras() { return {}; }

  get promoItems() {
    const d = this.state.doc;
    if (!d) return [];
    return d.products.filter(p => p.featured && !p.out);
  }

  promoTrack = (el) => {
    this._promoTrack = el;
    this._sizePromoSpacer();
    if (el && !el.__dragBound) { el.__dragBound = true; this._bindPromoDrag(el); }
  };

  /* touch-action + scroll-snap deveriam bastar pro navegador entender "gesto
     horizontal é meu, vertical eu devolvo pra página" sozinho — mas isso tem
     bugs conhecidos e antigos em navegadores móveis (sobretudo Safari/iOS)
     que travam o gesto no scroller horizontal de qualquer forma, mesmo com
     tudo configurado certo. Aqui a decisão deixa de ser do navegador: com
     touch-action:none no trilho, ele nunca rola nada sozinho, e este código
     decide na mão se o arrasto é horizontal (rola o carrossel) ou vertical
     (rola a página) a partir da direção real do primeiro movimento. */
  _bindPromoDrag(el) {
    var startX = 0, startY = 0, startScrollLeft = 0, startWinY = 0, axis = null, dragged = false;
    var THRESHOLD = 8;

    var onMove = (e) => {
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (axis === null) {
        if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        dragged = true;
      }
      if (axis === 'x') {
        el.scrollLeft = startScrollLeft - dx;
      } else {
        window.scrollTo(0, startWinY - dy);
      }
    };

    var onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (axis === 'x') {
        // Encaixa no card mais próximo de onde soltou, como o scroll-snap faria.
        var closest = 0, min = Infinity;
        Array.from(el.children).forEach((c, i) => {
          var d = Math.abs(c.offsetLeft - 18 - el.scrollLeft);
          if (d < min) { min = d; closest = i; }
        });
        this._scrollPromoTo(closest);
      }
      if (dragged) {
        // Um arrasto de verdade não deve também abrir a ficha do produto —
        // engole só o próximo clique, que é o que o soltar do dedo dispara.
        // O timeout é a rede de segurança: se nenhum clique vier (o mais
        // comum depois de um arrasto), o listener não pode ficar pendurado
        // pra sempre e engolir um clique de outra hora sem relação nenhuma.
        var swallow = (e) => { e.stopPropagation(); e.preventDefault(); cleanup(); };
        var cleanup = () => { el.removeEventListener('click', swallow, true); clearTimeout(swallowTimer); };
        var swallowTimer = setTimeout(cleanup, 400);
        el.addEventListener('click', swallow, true);
      }
    };

    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      cancelAnimationFrame(this._promoAnimId);
      startX = e.clientX; startY = e.clientY;
      startScrollLeft = el.scrollLeft; startWinY = window.scrollY;
      axis = null; dragged = false;
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  promoSpacer = (el) => {
    this._promoSpacer = el;
    this._sizePromoSpacer();
  };

  /* Com poucos cards (2-4), a largura total do carrossel quase cabe na tela
     inteira — sobra pouquíssimo espaço de rolagem (scrollWidth-clientWidth),
     então o scroll-snap trava perto do início: as setas "‹›" e o arrasto com
     o dedo param de se mover bem antes de conseguir isolar os últimos cards.
     Este espaçador invisível no fim do trilho garante scroll de sobra pra
     qualquer card conseguir chegar alinhado ao início da tela, não importa
     quantos cards existam ou a largura da tela. */
  _sizePromoSpacer() {
    /* Os refs de track/spacer disparam durante a criação dos nós, antes de o
       elemento estar de fato inserido no documento — clientWidth ainda daria
       0 aqui. requestAnimationFrame adia pro próximo frame, já com o layout
       real aplicado. */
    requestAnimationFrame(() => {
      const track = this._promoTrack, spacer = this._promoSpacer;
      if (!track || !spacer) return;
      const CARD_W = 154; // precisa bater com o width do .card no template acima
      spacer.style.width = Math.max(0, track.clientWidth - CARD_W) + 'px';
    });
  }

  /* Arrastar a alça pra baixo fecha a ficha/carrinho — segue o dedo em tempo
     real (sem transição) e só anima de volta pro lugar se soltar sem ter
     arrastado o suficiente. */
  sheetDrag = (e) => {
    const box = e.currentTarget.closest('.sheet-box');
    if (!box) return;
    box.style.transition = 'none';
    const startY = e.clientY;
    const onMove = (ev) => {
      const dy = Math.max(0, ev.clientY - startY);
      box.style.transform = 'translateY(' + dy + 'px)';
    };
    const onUp = (ev) => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      const dy = Math.max(0, ev.clientY - startY);
      if (dy > 80) {
        this.setState({ open: null, cartOpen: false, added: '' });
      } else {
        box.style.transition = 'transform .2s ease';
        box.style.transform = '';
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  };

  _scrollPromoTo(i) {
    const el = this._promoTrack;
    if (!el || !el.children[i]) return;
    this._animatePromoScroll(el.children[i].offsetLeft - 18);
    this.setState({ promoIdx: i });
  }

  /* Anima o scroll do carrossel de promoções na mão, em vez de
     scrollTo({behavior:'smooth'}) — chamado de novo antes da animação
     anterior terminar (clicar em ‹› rápido demais, por exemplo), o smooth
     nativo simplesmente descarta a chamada nova e o carrossel para de
     responder. Aqui sempre cancela a animação anterior antes de iniciar a
     próxima; ease-in-out cúbico pra a transição ficar suave nas duas pontas. */
  _animatePromoScroll(target) {
    const el = this._promoTrack;
    if (!el) return;
    cancelAnimationFrame(this._promoAnimId);
    const start = el.scrollLeft, dist = target - start;
    if (Math.abs(dist) < 1) return;
    const duration = 420, t0 = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = (now) => {
      const t = Math.min(1, (now - t0) / duration);
      el.scrollLeft = start + dist * ease(t);
      if (t < 1) this._promoAnimId = requestAnimationFrame(step);
    };
    this._promoAnimId = requestAnimationFrame(step);
  }

  onPromoScroll = (e) => {
    const el = e.target;
    let closest = 0, min = Infinity;
    Array.from(el.children).forEach((c, i) => {
      const dist = Math.abs(c.offsetLeft - 18 - el.scrollLeft);
      if (dist < min) { min = dist; closest = i; }
    });
    if (closest !== this.state.promoIdx) this.setState({ promoIdx: closest });
  };

  promoPrev = () => {
    const n = this.promoItems.length;
    this._scrollPromoTo((this.state.promoIdx - 1 + n) % n);
  };

  promoNext = () => {
    const n = this.promoItems.length;
    this._scrollPromoTo((this.state.promoIdx + 1) % n);
  };

  extrasFor(it) {
    const d = this.state.doc;
    if (!d || !it) return [];
    const ids = (it.upsell || []).concat(d.settings.globalUpsell || []);
    const seen = {};
    return ids
      .filter(id => id !== it.id && !seen[id] && (seen[id] = 1))
      .map(id => d.products.find(p => p.id === id))
      .filter(p => p && !p.out)
      .map(p => ({ name: p.name, price: p.price }));
  }

  seedData = [
    { name: 'Cervejas', items: [
      { id: 'cv1', name: 'Skol fina 269ml', vol: 'Garrafa 269ml', price: 3.5, fardos: [[15, 42]] },
      { id: 'cv2', name: 'Skol 350ml', vol: 'Lata 350ml', price: 5, fardos: [[12, 45], [15, 56.5]] },
      { id: 'cv3', name: 'Itaipava fina 269ml', vol: 'Garrafa 269ml', price: 3.5, fardos: [[12, 30], [15, 37.5]] },
      { id: 'cv4', name: 'Itaipava 350ml', vol: 'Lata 350ml', price: 5, fardos: [[12, 35], [15, 43.75]] },
      { id: 'cv5', name: 'Petra fina 269ml', vol: 'Garrafa 269ml', price: 3.5, fardos: [[12, 32], [15, 40]] },
      { id: 'cv6', name: 'Brahma fina 269ml', vol: 'Garrafa 269ml', price: 4, fardos: [[15, 44]] },
      { id: 'cv7', name: 'Brahma latão 350ml', vol: 'Latão 350ml', price: 6, fardos: [[12, 45], [15, 56.25]] },
      { id: 'cv8', name: 'Império fina 269ml', vol: 'Garrafa 269ml', price: 3.5, fardos: [[12, 35], [15, 43.25]] },
      { id: 'cv9', name: 'Amstel fina 269ml', vol: 'Garrafa 269ml', price: 4, fardos: [[12, 38], [15, 47.5]] },
      { id: 'cv10', name: 'Budweiser 269ml', vol: 'Garrafa 269ml', price: 4, fardos: [[8, 30], [15, 55]] },
      { id: 'cv11', name: 'Original 269ml', vol: 'Garrafa 269ml', price: 4, fardos: [[8, 30], [15, 55]] },
      { id: 'cv12', name: 'Spaten 269ml', vol: 'Garrafa 269ml', price: 5, fardos: [[8, 30], [15, 55]] },
      { id: 'cv13', name: 'Heineken fina 269ml', vol: 'Garrafa 269ml', price: 5, fardos: [[8, 37], [15, 69.5]] },
      { id: 'cv14', name: 'Heineken fina zero 269ml', vol: 'Garrafa 269ml · sem álcool', price: 5, fardos: [[8, 37.5], [15, 70]] },
      { id: 'cv15', name: 'Heineken 350ml', vol: 'Lata 350ml', price: 7.5, fardos: [[12, 67], [15, 83.75]] },
      { id: 'cv16', name: 'Michelob 350ml', vol: 'Lata 350ml', price: 6.5, fardos: [[12, 63], [15, 78.75]] }
    ] }
  ];

  extras = {};

  componentDidMount() {
    const boot = () => {
      if (!window.VN) return setTimeout(boot, 60);
      VN.load().then(r => this.setState({ doc: r.doc }));
      this._poll = setInterval(() => {
        if (document.hidden) return;
        VN.load().then(r => {
          const a = JSON.stringify(r.doc), b = JSON.stringify(this.state.doc);
          if (a !== b) this.setState({ doc: r.doc });
        });
      }, 6000);
      this._vis = () => {
        if (!document.hidden) VN.load().then(r => this.setState({ doc: r.doc }));
      };
      document.addEventListener('visibilitychange', this._vis);
      this._storage = (e) => {
        if (e.key === 'vn.doc') VN.load().then(r => this.setState({ doc: r.doc }));
      };
      window.addEventListener('storage', this._storage);
    };
    boot();
    this._onResize = () => this._sizePromoSpacer();
    window.addEventListener('resize', this._onResize);
  }



  componentDidUpdate() {
    /* No celular, deixar a página de fundo ainda rolando com uma ficha fixa por cima
       causa um bug visual de "fantasma" (o Safari/iOS repinta errado durante o scroll).
       Trava o scroll do body enquanto qualquer ficha/carrinho estiver aberto. */
    const s = this.state;
    const anyOpen = !!s.open || s.cartOpen || !!s.added || s.done;
    if (anyOpen && !this._scrollLocked) {
      this._scrollY = window.scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = '-' + this._scrollY + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
      this._scrollLocked = true;
    } else if (!anyOpen && this._scrollLocked) {
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, this._scrollY || 0);
      this._scrollLocked = false;
    }

    if (s.cart !== this._prevCart) {
      this._prevCart = s.cart;
      try { localStorage.setItem('vn.cart', JSON.stringify(s.cart)); } catch (e) {}
    }
  }

  componentWillUnmount() {
    clearInterval(this._poll);
    if (this._vis) document.removeEventListener('visibilitychange', this._vis);
    if (this._storage) window.removeEventListener('storage', this._storage);
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    cancelAnimationFrame(this._promoAnimId);
  }

  fmt(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }

  optsOf(it) {
    const list = [{ label: 'Unidade', price: it.price, each: '' }];
    (it.fardos || []).forEach(f => list.push({
      label: 'Fardo ' + f[0] + ' un', price: f[1], each: this.fmt(f[1] / f[0]) + ' cada'
    }));
    return list;
  }

  openItem(it, cat) {
    if (window.VN) VN.track('click', { product: it.name, qty: 1, total: it.price });
    if (this.variant() === 'Rápida') return this.quickAdd(it);
    this.setState({ open: Object.assign({}, it, { cat: cat }), qty: 1, opt: 0, sel: {}, obs: '', cartOpen: false, added: '' });
  }

  quickAdd(it) {
    /* Comparava l.name === it.name, mas a linha nova é salva como
       it.name + ' · unidade' — nunca batia, então cada toque no "+" rápido
       (variante "Rápida" e cards de promoção) criava uma linha duplicada em
       vez de somar 1 na já existente. simpleLineIndex já resolve isso certo
       (compara pid, preço e ausência de extras/obs) e é o mesmo critério
       usado pelo stepper da lista. */
    this.setState(st => {
      const i = this.simpleLineIndex(st.cart, it);
      const cart = i >= 0
        ? st.cart.map((l, j) => j === i ? Object.assign({}, l, { qty: l.qty + 1 }) : l)
        : st.cart.concat([{ name: it.name + ' · unidade', unit: it.price, qty: 1, obs: '', extras: [], photo: it.photo || '', pid: it.id }]);
      return { cart: cart, added: it.name, addedLineIndex: i >= 0 ? i : cart.length - 1, open: null, cartOpen: false };
    });
  }

  variant() {
    const cfg = (this.state.doc && this.state.doc.settings) || {};
    return this.state.variant || cfg.itemStyle || this.props.itemStyle || 'Compacta';
  }

  unitOf(it, sel, opt) {
    const list = this.extrasFor(it);
    const o = this.optsOf(it)[opt] || this.optsOf(it)[0];
    return o.price + list.reduce((t, a) => t + (sel[a.name] ? a.price : 0), 0);
  }

  bump(i, d) {
    this.setState(st => ({ cart: st.cart.map((l, j) => j === i ? Object.assign({}, l, { qty: Math.max(1, l.qty + d) }) : l) }));
  }

  /* Stepper direto na lista: só mexe na linha "unidade" simples (sem fardo,
     adicional ou observação) — pra qualquer outra variação, o cliente ainda
     precisa abrir a ficha, que é onde essas escolhas fazem sentido. */
  simpleLineIndex(cart, it) {
    return cart.findIndex(l => l.pid === it.id && l.unit === it.price && !l.extras.length && !l.obs);
  }

  bumpSimple(it, delta) {
    this.setState(st => {
      const i = this.simpleLineIndex(st.cart, it);
      if (i < 0) {
        if (delta <= 0) return null;
        return { cart: st.cart.concat([{ name: it.name + ' · unidade', unit: it.price, qty: 1, obs: '', extras: [], photo: it.photo || '', pid: it.id }]) };
      }
      const qty = st.cart[i].qty + delta;
      return { cart: qty <= 0 ? st.cart.filter((_, j) => j !== i) : st.cart.map((l, j) => j === i ? Object.assign({}, l, { qty: qty }) : l) };
    });
  }

  buildMsg(subtotal, feeVal) {
    const s = this.state, fmt = this.fmt.bind(this);
    const rows = s.cart.map(l => l.qty + 'x ' + l.name + (l.extras.length ? ' (+ ' + l.extras.join(', ') + ')' : '') + (l.obs ? ' — ' + l.obs : '') + '  ' + fmt(l.unit * l.qty));
    const out = ['*Pedido — Vai Nessa Adega*', ''].concat(rows, ['',
      'Subtotal: ' + fmt(subtotal),
      (s.mode === 'entrega' ? 'Entrega: ' + fmt(feeVal) : 'Retirada na adega'),
      'Total: ' + fmt(subtotal + feeVal), '',
      'Nome: ' + (s.nome || '—'),
      'WhatsApp: ' + (s.telefone || '—')
    ]);
    if (s.mode === 'entrega') out.push('Endereço: ' + (this.fullAddress() || '—'));
    return out.join('\n');
  }

  fullAddress() {
    const s = this.state;
    const ruaNum = [s.rua, s.numero].filter(Boolean).join(', ');
    return [ruaNum, s.bairro, s.cep].filter(Boolean).join(' - ');
  }

  geocodeAddress() {
    const s = this.state;
    const ruaNum = [s.rua, s.numero].filter(Boolean).join(', ');
    return [ruaNum, s.bairro].filter(Boolean).join(', ');
  }

  scheduleDeliveryCalc(storeAddress, pricePerKm, kmOn) {
    if (!kmOn) return;
    clearTimeout(this._addrTimer);
    this.setState({ deliveryCalcStatus: 'loading' });
    this._addrTimer = setTimeout(() => {
      const q = this.geocodeAddress();
      if (q.trim().length > 6) this.calcDelivery(storeAddress, q, pricePerKm);
      else this.setState({ deliveryCalcStatus: 'idle' });
    }, 900);
  }

  lookupCep(cep, storeAddress, pricePerKm, kmOn) {
    const digits = cep.replace(/\D/g, '');
    if (digits.length !== 8) return;
    this.setState({ cepStatus: 'loading' });
    fetch('https://viacep.com.br/ws/' + digits + '/json/')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d || d.erro) return this.setState({ cepStatus: 'error' });
        this.setState(st => ({
          cepStatus: 'ok',
          rua: d.logradouro || st.rua,
          bairro: d.bairro || st.bairro
        }));
        this.scheduleDeliveryCalc(storeAddress, pricePerKm, kmOn);
      })
      .catch(() => this.setState({ cepStatus: 'error' }));
  }

  geocode(address) {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=' + encodeURIComponent(address);
    return fetch(url).then(r => r.ok ? r.json() : []).then(rows => {
      if (!rows || !rows.length) return null;
      return { lat: parseFloat(rows[0].lat), lng: parseFloat(rows[0].lon) };
    }).catch(() => null);
  }

  /* Busca estruturada (rua + número + CEP) em vez de um texto só — o Nominatim casa cada
     pedaço com o campo certo do endereço em vez de tentar adivinhar, então é bem mais
     exato quando temos o CEP. Prioriza o CEP puro (a área certa quase sempre bate) e
     refina com a rua/número quando dá certo. */
  geocodeStructured(rua, numero, cep) {
    const params = new URLSearchParams({ format: 'json', limit: '1', countrycodes: 'br' });
    const street = [numero, rua].filter(Boolean).join(' ').trim();
    if (street) params.set('street', street);
    const digits = String(cep || '').replace(/\D/g, '');
    if (digits.length === 8) params.set('postalcode', digits.slice(0, 5) + '-' + digits.slice(5));
    params.set('country', 'Brazil');
    if (!street && !digits) return Promise.resolve(null);
    const url = 'https://nominatim.openstreetmap.org/search?' + params.toString();
    return fetch(url).then(r => r.ok ? r.json() : []).then(rows => {
      if (!rows || !rows.length) return null;
      return { lat: parseFloat(rows[0].lat), lng: parseFloat(rows[0].lon) };
    }).catch(() => null);
  }

  /* Bairros digitados de forma informal (ex: "Cidade Nova São Miguel", "Jardim Nair")
     às vezes não batem com o nome oficial no OpenStreetMap. Se a busca completa falhar,
     tenta de novo com menos detalhe — rua + número + cidade, depois só rua + cidade —
     até achar alguma coisa. Uma pausa entre tentativas por causa do limite de uso do Nominatim. */
  geocodeWithFallback(address) {
    const parts = address.split(',').map(s => s.trim()).filter(Boolean);
    const last = parts[parts.length - 1];
    const candidates = [address];
    if (parts.length >= 3) {
      const withNumber = [parts[0], parts[1], last].join(', ');
      if (!candidates.includes(withNumber)) candidates.push(withNumber);
    }
    if (parts.length >= 2) {
      const streetOnly = [parts[0], last].join(', ');
      if (!candidates.includes(streetOnly)) candidates.push(streetOnly);
    }
    const tryNext = i => {
      if (i >= candidates.length) return Promise.resolve(null);
      const attempt = i === 0 ? this.geocode(candidates[i]) : new Promise(r => setTimeout(r, 600)).then(() => this.geocode(candidates[i]));
      return attempt.then(g => g || tryNext(i + 1));
    };
    return tryNext(0);
  }

  routeKm(a, b) {
    const url = 'https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=false';
    return fetch(url).then(r => r.ok ? r.json() : null).then(data => {
      const route = data && data.routes && data.routes[0];
      return route ? route.distance / 1000 : null;
    }).catch(() => null);
  }

  /* Arredonda o frete pra um valor redondo em vez de centavos exatos:
     menos de 25 centavos cai pro real cheio, 25 a 69 vira ",50", 70+ sobe pro próximo real. */
  showToast(msg) {
    clearTimeout(this._toastTimer);
    this.setState({ toast: msg });
    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 2600);
  }

  roundFee(v) {
    const whole = Math.floor(v);
    const cents = Math.round((v - whole) * 100);
    if (cents < 25) return whole;
    if (cents < 70) return whole + 0.5;
    return whole + 1;
  }

  normalizeForGeocode(addr) {
    const a = addr.replace(/\s*[—–]\s*/g, ', ').trim();
    return /s(ã|a)o paulo/i.test(a) ? a : a + ', São Paulo - SP';
  }

  calcDelivery(storeAddressRaw, custAddressRaw, pricePerKm) {
    const storeAddress = this.normalizeForGeocode(storeAddressRaw);
    const custAddress = this.normalizeForGeocode(custAddressRaw);
    const key = storeAddress + '|' + custAddress;
    if (this._deliveryCalcKey === key) return;
    this._deliveryCalcKey = key;
    this.setState({ deliveryCalcStatus: 'loading' });
    const wait = ms => new Promise(r => setTimeout(r, ms));
    /* Nominatim pede no máx. ~1 req/s da mesma origem — chamadas em paralelo
       às vezes voltam vazias. Fazendo uma de cada vez, com uma pausa entre elas. */
    const storeGeo = this._storeGeoCache && this._storeGeoAddr === storeAddress
      ? Promise.resolve(this._storeGeoCache)
      : this.geocodeWithFallback(storeAddress).then(g => { this._storeGeoCache = g; this._storeGeoAddr = storeAddress; return g; });
    storeGeo.then(origin => {
      if (this._deliveryCalcKey !== key) return;
      if (!origin) return this.setState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
      const s = this.state;
      return wait(600)
        .then(() => this.geocodeStructured(s.rua, s.numero, s.cep))
        .then(dest => dest || wait(600).then(() => this.geocodeWithFallback(custAddress)))
        .then(dest => {
        if (this._deliveryCalcKey !== key) return;
        if (!dest) return this.setState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
        return this.routeKm(origin, dest).then(km => {
          if (this._deliveryCalcKey !== key) return;
          if (km == null) return this.setState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
          this.setState({ deliveryCalcStatus: 'ok', deliveryKm: km, deliveryFeeCalc: this.roundFee(km * pricePerKm) });
        });
      });
    });
  }

  renderVals() {
    const s = this.state, fmt = this.fmt.bind(this), V = this.variant();
    const cfg = (s.doc && s.doc.settings) || {};
    const flatFee = cfg.deliveryFee != null ? cfg.deliveryFee : (this.props.deliveryFee != null ? this.props.deliveryFee : 8);
    const pricePerKm = Number(cfg.pricePerKm) || 4;
    const kmOn = cfg.kmDelivery !== false;
    const fee = (kmOn && s.deliveryCalcStatus === 'ok' && s.deliveryFeeCalc != null) ? s.deliveryFeeCalc : flatFee;
    const phone = cfg.whatsapp || this.props.whatsapp || '5511999347715';
    const freeAbove = Number(cfg.freeAbove) || 0;
    const address = cfg.address || 'Rua Moacir Dantas Itapicuru, 911 — Cidade Nova São Miguel Paulista';
    const addrParts = address.split(/\s+[—-]\s+/);

    const pill = 'flex:none;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;';
    const onSt = 'border:1px solid var(--color-accent);color:#fff;background:var(--color-accent);box-shadow:0 4px 12px rgba(216,27,132,.28)';
    const offSt = 'border:1px solid var(--line);color:var(--color-neutral-500);background:#fff';

    const variants = ['Compacta', 'Foto grande', 'Rápida'].map(v => ({
      name: v,
      style: 'flex:none;cursor:pointer;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:transparent;' + (v === V ? 'border:1px solid var(--color-accent);color:var(--color-accent)' : 'border:1px solid var(--line);color:var(--color-neutral-600)'),
      onClick: () => this.setState({ variant: v, open: null })
    }));

    const cats = ['Todos'].concat(this.data.map(g => g.name));
    const tabs = cats.map((c, i) => ({
      name: c, style: pill + (c === s.cat ? onSt : offSt),
      onClick: () => this.setState({ cat: c, catDir: i >= cats.indexOf(s.cat) ? 'r' : 'l' })
    }));
    const groupsAnimStyle = 'animation:' + (s.catDir === 'l' ? 'slideInLeft' : 'slideInRight') + ' .28s cubic-bezier(.2,.8,.2,1);';

    const q = s.q.trim().toLowerCase();
    const match = it => !q || (it.name + ' ' + (it.vol || '')).toLowerCase().includes(q);
    const quick = V === 'Rápida';
    const plusStyle = 'width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;margin-top:29px;' + (quick
      ? 'border:1px solid var(--color-accent);color:var(--color-accent);background:rgba(216,27,132,.08)'
      : 'border:1px solid var(--line);color:var(--color-accent)');
    const groups = this.data
      .filter(g => s.cat === 'Todos' || g.name === s.cat)
      .map(g => {
        const items = g.items.filter(match).map(it => {
          const li = this.simpleLineIndex(s.cart, it);
          return {
            name: it.name, tag: it.tag,
            desc: [it.vol].concat((it.fardos || []).map(f => 'fardo ' + f[0] + ' un ' + fmt(f[1]))).join(' · '),
            priceLabel: fmt(it.price) + ' un',
            slotId: 'vn-' + it.id, photoUrl: it.photo || '', plusStyle: plusStyle, plusLabel: '+',
            onOpen: () => this.openItem(it, g.name),
            rowQty: li >= 0 ? s.cart[li].qty : 0,
            /* onQuickAdd é só pro primeiro toque (ainda não tá no carrinho) —
               usa quickAdd (mostra o toast de confirmação). Depois que já tem
               uma linha, os toques no stepper usam bumpSimple, sem toast:
               o número mudando ali já é a confirmação. */
            onQuickAdd: e => { e.stopPropagation(); this.quickAdd(it); },
            onRowInc: e => { e.stopPropagation(); this.bumpSimple(it, 1); },
            onRowDec: e => { e.stopPropagation(); this.bumpSimple(it, -1); }
          };
        });
        return { name: g.name, count: items.length + (items.length === 1 ? ' item' : ' itens'), items: items };
      })
      .filter(g => g.items.length);

    const open = s.open;
    const promos = this.promoItems.map(p => ({
      name: p.name, desc: [p.vol].concat((p.fardos || []).map(f => 'fardo ' + f[0] + ' un ' + fmt(f[1]))).join(' · '),
      priceLabel: fmt(p.price) + ' un', tagLabel: p.tag || 'Promoção',
      slotId: 'vn-promo-' + p.id, photoUrl: p.photo || '',
      onOpen: () => this.openItem(p, (this.data.find(g => g.items.some(it => it.id === p.id)) || {}).name),
      onAdd: e => { e.stopPropagation(); this.quickAdd(p); }
    }));
    const promoIdx = Math.min(s.promoIdx, Math.max(0, promos.length - 1));
    const promoDots = promos.map((_, i) => ({
      onClick: () => this._scrollPromoTo(i),
      style: 'padding:0;border:none;cursor:pointer;border-radius:999px;transition:width .2s;' +
        (i === promoIdx ? 'width:16px;height:6px;background:var(--brand-2)' : 'width:6px;height:6px;background:var(--color-neutral-300)')
    }));
    const extras = open ? this.extrasFor(open) : [];
    const addons = extras.map(a => ({
      name: a.name, priceLabel: '+ ' + fmt(a.price), mark: s.sel[a.name] ? '✓' : '',
      chipLabel: a.name + ' · ' + fmt(a.price),
      chipStyle: pill + 'font-size:12.5px;' + (s.sel[a.name] ? onSt : offSt),
      boxStyle: 'width:19px;height:19px;flex:none;border-radius:5px;display:grid;place-items:center;font-size:11px;' + (s.sel[a.name]
        ? 'border:1px solid var(--color-accent);background:rgba(216,27,132,.16);color:var(--color-accent)'
        : 'border:1px solid var(--line);color:transparent'),
      onToggle: () => this.setState(st => { const sel = Object.assign({}, st.sel); sel[a.name] = !sel[a.name]; return { sel: sel }; })
    }));
    const optList = open ? this.optsOf(open) : [];
    const optIdx = Math.min(s.opt, Math.max(0, optList.length - 1));
    const opts = optList.map((o, i) => ({
      label: o.label, each: o.each, priceLabel: fmt(o.price),
      dotStyle: 'width:18px;height:18px;flex:none;border-radius:50%;box-sizing:border-box;' + (i === optIdx
        ? 'border:5px solid var(--color-accent)'
        : 'border:1px solid var(--line)'),
      onPick: () => this.setState({ opt: i })
    }));
    const unit = open ? this.unitOf(open, s.sel, optIdx) : 0;

    const lines = s.cart.map((l, i) => ({
      name: l.name, qty: l.qty, qtyLabel: l.qty + 'x', totalLabel: fmt(l.unit * l.qty),
      photoUrl: l.photo || '', slotId: 'vn-cart-' + (l.pid || i) + '-' + i,
      detail: [l.extras.length ? '+ ' + l.extras.join(', ') : null, l.obs ? '“' + l.obs + '”' : null, fmt(l.unit) + ' cada'].filter(Boolean).join(' · '),
      onInc: () => this.bump(i, 1), onDec: () => this.bump(i, -1),
      onRemove: () => this.setState(st => ({ cart: st.cart.filter((x, j) => j !== i) }))
    }));
    const subtotal = s.cart.reduce((t, l) => t + l.unit * l.qty, 0);
    const count = s.cart.reduce((t, l) => t + l.qty, 0);
    const isEntrega = s.mode === 'entrega';
    const freeOk = freeAbove > 0 && subtotal >= freeAbove;
    const showFeeRow = !isEntrega || s.cep.trim().length > 0;
    const feeVal = isEntrega && !freeOk && showFeeRow ? fee : 0;
    const freeHint = (freeAbove > 0 && isEntrega && count)
      ? (freeOk ? 'Frete grátis aplicado.' : 'Faltam ' + fmt(freeAbove - subtotal) + ' pro frete grátis.')
      : '';
    const modeBase = 'flex:1;cursor:pointer;font-family:var(--font-heading);font-weight:500;font-size:13px;padding:11px 8px;border-radius:10px;background:transparent;';
    const modeOn = 'border:1px solid var(--color-accent);color:var(--color-accent);background:rgba(216,27,132,.08)';

    return {
      loaded: !!s.doc,
      q: s.q, obs: s.obs, qty: s.qty, nome: s.nome, cep: s.cep, rua: s.rua, numero: s.numero, bairro: s.bairro, toast: s.toast, variants: variants,
      cepHint: s.cepStatus === 'loading' ? 'Buscando endereço…' : s.cepStatus === 'error' ? 'CEP não encontrado — preencha manualmente.' : '',
      addrCollapsed: s.cepStatus === 'ok' && !!s.rua.trim() && !s.addrEdit,
      addrSummary: [s.rua, s.bairro].filter(Boolean).join(' · '),
      onAddrEdit: () => this.setState({ addrEdit: true }),
      onCep: e => {
        const v = e.target.value;
        this.setState({ cep: v, addrEdit: false });
        clearTimeout(this._cepTimer);
        this._cepTimer = setTimeout(() => this.lookupCep(v, address, pricePerKm, kmOn), 500);
      },
      onRua: e => { this.setState({ rua: e.target.value }); this.scheduleDeliveryCalc(address, pricePerKm, kmOn); },
      onNumero: e => { this.setState({ numero: e.target.value }); this.scheduleDeliveryCalc(address, pricePerKm, kmOn); },
      onBairro: e => { this.setState({ bairro: e.target.value }); this.scheduleDeliveryCalc(address, pricePerKm, kmOn); },
      onSearch: e => {
        const v = e.target.value;
        const startedTyping = !s.q.trim() && v.trim();
        this.setState({ q: v });
        if (startedTyping) {
          requestAnimationFrame(() => {
            const el = document.getElementById('vn-chips-bar');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        }
      },
      onObs: e => this.setState({ obs: e.target.value }),
      onNome: e => this.setState({ nome: e.target.value }),
      waLabel: 'Seu WhatsApp' + (isEntrega ? '' : ' (opcional)'),
      confirmHint: isEntrega
        ? 'Verifique os itens, o nome e o endereço antes de enviar o pedido.'
        : 'Verifique os itens e o nome antes de enviar o pedido.',
      telefone: s.telefone,
      onTelefone: e => {
        const d = e.target.value.replace(/\D/g, '').slice(0, 11);
        const v = d.length > 10
          ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7)
          : (d.length > 6 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6)
            : (d.length > 2 ? '(' + d.slice(0, 2) + ') ' + d.slice(2) : d));
        this.setState({ telefone: v });
      },
      tabs: tabs, groups: groups, empty: groups.length === 0, groupsAnimStyle: groupsAnimStyle,
      showFeatured: promos.length > 0 && s.cat === 'Todos' && !q,
      promos: promos, promoDots: promoDots, promoTrack: this.promoTrack, promoSpacer: this.promoSpacer,
      promoPrev: this.promoPrev, promoNext: this.promoNext, onPromoScroll: this.onPromoScroll,
      opts: opts,
      item: open ? { name: open.name, desc: open.vol, priceLabel: fmt(unit * s.qty), sheetSlotId: 'vn-sheet-' + open.id, bigSlotId: 'vn-big-' + open.id, photoUrl: open.photo || '' } : null,
      sheetA: !!open && V === 'Compacta', sheetB: !!open && V === 'Foto grande',
      addons: addons, hasAddons: addons.length > 0,
      sheetTotalLabel: fmt(unit * s.qty),
      inc: () => this.setState(st => ({ qty: st.qty + 1 })),
      dec: () => this.setState(st => ({ qty: Math.max(1, st.qty - 1) })),
      addToCart: () => this.setState(st => ({
        cart: st.cart.concat([{ name: open.name + ' · ' + (optList[optIdx] || optList[0]).label.toLowerCase(), unit: unit, qty: st.qty, obs: st.obs, extras: extras.filter(a => st.sel[a.name]).map(a => a.name), photo: open.photo || '', pid: open.id }]),
        open: null, added: (st.qty > 1 ? st.qty + 'x ' : '') + open.name, addedLineIndex: st.cart.length
      })),
      closeSheet: () => this.setState({ open: null, cartOpen: false, added: '' }),
      sheetDrag: this.sheetDrag,
      stop: e => e.stopPropagation(),
      hasCart: count > 0, cartOpen: s.cartOpen,
      added: s.added,
      addedPhoto: (s.cart[s.addedLineIndex] && s.cart[s.addedLineIndex].photo) || '',
      addedSlotId: 'vn-added-' + (s.cart[s.addedLineIndex] ? (s.cart[s.addedLineIndex].pid || s.addedLineIndex) : '0'),
      addedQty: s.cart[s.addedLineIndex] ? s.cart[s.addedLineIndex].qty : 1,
      onAddedInc: () => this.bump(s.addedLineIndex, 1),
      onAddedDec: () => this.bump(s.addedLineIndex, -1),
      goCart: () => this.setState({ added: '', cartOpen: true }),
      keepChoosing: () => this.setState({ added: '' }),
      cartCountLabel: count + (count === 1 ? ' item' : ' itens'), cartCount: count,
      cartTotalLabel: fmt(subtotal),
      openCart: () => this.setState({ cartOpen: true, open: null, added: '' }),
      lines: lines, subtotalLabel: fmt(subtotal),
      showFeeRow: showFeeRow,
      feeName: isEntrega
        ? 'Entrega' + (kmOn && s.deliveryCalcStatus === 'ok' && s.deliveryKm != null ? ' (' + s.deliveryKm.toFixed(1) + ' km)' : '')
        : 'Retirada na adega',
      feeRowStyle: 'display:flex;justify-content:space-between;color:var(--color-neutral-400)',
      feeValueStyle: '',
      deliveryCalcHint: !kmOn || !isEntrega ? '' : (
        s.deliveryCalcStatus === 'loading' ? 'Calculando frete pela distância…' :
        s.deliveryCalcStatus === 'error' ? 'Não achamos esse endereço — usando taxa fixa de ' + fmt(flatFee) + '.' :
        ''
      ),
      feeLabel: !isEntrega ? 'grátis'
        : freeOk ? 'grátis'
        : (kmOn && s.deliveryCalcStatus === 'loading') ? 'calculando…'
        : fmt(feeVal),
      freeHint: freeHint,
      accentVars: cfg.accent
        ? '--color-accent:' + cfg.accent
          + ';--brand-2:' + cfg.accent
          + ';--brand-2-text:color-mix(in srgb, ' + cfg.accent + ' 80%, #17171b)'
          + ';--brand-2-soft:color-mix(in srgb, ' + cfg.accent + ' 10%, transparent)'
        : '',
      onShare: () => {
        const url = 'https://www.vainessa.online/';
        const data = { title: 'Vai Nessa', text: 'Confira o cardápio da Vai Nessa!', url: url };
        if (navigator.share) { navigator.share(data).catch(() => {}); return; }
        if (navigator.clipboard) { navigator.clipboard.writeText(url).then(() => this.showToast('Link copiado!')); return; }
        this.showToast(url);
      },
      showSwitcher: !!cfg.showSwitcher,
      tagline: cfg.tagline || 'Sua bebida gelada, com entrega rápida até você.',
      storeNamePart1: (cfg.storeName || 'Vai Nessa').split(' ')[0],
      storeNamePart2: (cfg.storeName || 'Vai Nessa').split(' ').slice(1).join(' '),
      logoUrl: cfg.logo || '', coverUrl: cfg.cover || '',
      paymentsLabel: cfg.payments || 'Pix · cartão · dinheiro',
      hoursLabel: cfg.hours || 'Aberto até 23:00',
      minutesLabel: cfg.minutes || 'Entrega 20–40 min',
      addr1: addrParts[0] || '', addr2: addrParts[1] || '',
      mapHref: 'https://maps.google.com/?q=' + encodeURIComponent(address),
      upsellTitle: cfg.upsellTitle || 'Quer junto?',
      totalLabel: fmt(subtotal + feeVal),
      isEntrega: isEntrega,
      entregaStyle: modeBase + (isEntrega ? modeOn : offSt),
      retiradaStyle: modeBase + (isEntrega ? offSt : modeOn),
      setEntrega: () => {
        this.setState({ mode: 'entrega' });
        this.scheduleDeliveryCalc(address, pricePerKm, kmOn);
      },
      setRetirada: () => this.setState({ mode: 'retirada' }),
      send: () => {
        const missing = [];
        if (!s.nome.trim()) missing.push('seu nome');
        if (isEntrega && s.telefone.replace(/\D/g, '').length < 10) missing.push('seu WhatsApp');
        if (isEntrega) {
          if (!s.rua.trim()) missing.push('a rua');
          if (!s.numero.trim()) missing.push('o número');
        }
        if (missing.length) return this.showToast('Falta preencher ' + missing.join(', ') + '.');
        if (window.VN) {
          VN.track('order', {
            product: null, qty: count, total: subtotal + feeVal,
            detail: {
              nome: s.nome, telefone: s.telefone, endereco: this.fullAddress(), mode: s.mode,
              itens: s.cart.map(l => ({ name: l.name, qty: l.qty, total: l.unit * l.qty }))
            }
          });
          s.cart.forEach(l => VN.track('sale', { product: l.name, qty: l.qty, total: l.unit * l.qty }));
        }
        this.setState({ done: true, cartOpen: false, msg: this.buildMsg(subtotal, feeVal) });
      },
      done: s.done, waMessage: s.msg,
      waHref: 'https://wa.me/' + phone + '?text=' + encodeURIComponent(s.msg || ''),
      reset: () => this.setState({ done: false, cart: [], nome: '', telefone: '', cep: '', rua: '', numero: '', bairro: '', cepStatus: 'idle', addrEdit: false, msg: '' })
    };
  }
}

</script>
</body>
