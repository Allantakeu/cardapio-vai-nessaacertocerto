<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap">

<script src="./vn-data.js"></script>
<style>
:root{
  --font-heading:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --color-bg:#ffffff;--color-surface:#f7f5f1;--color-text:#17171b;
  --color-accent:#d81b84;--color-accent-100:#8c104f;--color-accent-200:#fbd0e6;
  --color-accent-300:#f291c3;--color-accent-400:#e8579f;--color-accent-500:#d81b84;
  --color-accent-600:#b31569;--color-accent-700:#8c104f;--color-accent-800:#5d0a35;--color-accent-900:#33061d;
  --color-neutral-300:#a3a3ac;--color-neutral-400:#7c7c86;--color-neutral-500:#63636c;--color-neutral-600:#63636c;--color-neutral-700:#d8d6d1;
  --color-divider:rgba(23,23,27,.14);
  --gold:#f5c517;--gold-ink:#9c7400;
  --brand-2:#e6208c;--brand-2-soft:rgba(230,32,140,.10);--brand-2-text:#c11570;
  --line:rgba(23,23,27,.10);
  --shadow-sm:0 0 0 1px rgba(23,23,27,.08);
  --shadow-md:0 0 0 1px rgba(23,23,27,.08), 0 6px 18px rgba(23,23,27,.10);
  --shadow-lg:0 0 0 1px rgba(23,23,27,.08), 0 16px 40px rgba(23,23,27,.16);
}
body{margin:0;background:#ffffff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv05","ss03","kern";font-optical-sizing:auto}
h1,h2,h3,h4,h5,h6{font-feature-settings:"cv05","ss03","kern";text-wrap:balance}
p,.clamp2{text-wrap:pretty}
.eyebrow{font-family:var(--font-heading);font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum","kern";letter-spacing:-.01em}
.sect{font-family:var(--font-heading);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.itemname{font-family:var(--font-heading);font-weight:600;font-size:15.5px;letter-spacing:-.012em;line-height:1.25}
.desc{font-size:12.5px;line-height:1.5;color:var(--color-neutral-500);text-wrap:pretty;letter-spacing:.002em}
a{color:var(--color-accent);text-decoration:none}
.card{display:flex;flex-direction:column;background:#fff;border-radius:11px;padding:10px;gap:8px}
.elev-sm{box-shadow:var(--shadow-sm)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-family:var(--font-heading);font-weight:600;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-block{width:100%}
.btn-primary{border:1px solid var(--color-accent);color:var(--color-accent);background:rgba(216,27,132,.08)}
.btn-secondary{border:1px solid var(--line);color:var(--color-text);background:var(--color-surface)}
.btn-ghost{border:1px solid var(--line);border-radius:50%;color:var(--color-text);background:transparent}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--font-heading);font-weight:500;font-size:12px;color:var(--color-neutral-500)}
.input{width:100%;box-sizing:border-box;height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--color-surface);font-size:14px;color:var(--color-text)}
.input::placeholder{color:var(--color-neutral-400)}
.input:focus-visible{outline:2px solid var(--color-accent);outline-offset:-1px;border-color:var(--color-accent)}
a:hover{color:var(--color-accent-300)}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideInRight{from{transform:translateX(28px);opacity:.35}to{transform:none;opacity:1}}
@keyframes slideInLeft{from{transform:translateX(-28px);opacity:.35}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes skelPulse{0%,100%{opacity:.6}50%{opacity:1}}
.skel{background:rgba(23,23,27,.09);animation:skelPulse 1.3s ease-in-out infinite}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes couponPop{0%{transform:scale(.92);opacity:0}70%{transform:scale(1.02);opacity:1}100%{transform:scale(1);opacity:1}}
.couponCard{animation:couponPop .7s cubic-bezier(.2,.8,.2,1);transition:max-height .9s cubic-bezier(.4,0,.2,1),opacity .7s ease,margin-top .9s ease,padding .9s ease,transform .7s ease}
.couponRedeemBtn{transition:transform .15s ease,background-color .15s ease}
.couponRedeemBtn:active{transform:scale(.93)}
.noscroll::-webkit-scrollbar{height:0;width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itemRow{transition:background-color .15s ease}
.itemRow:hover{background:rgba(23,23,27,.035)}
.removeBtn{transition:background-color .15s ease, color .15s ease}
.removeBtn:hover{background:rgba(23,23,27,.05);color:var(--color-text)}
@media (min-width:481px){
  body{background:#e7e4dc}
  .vn-frame{margin:28px 0;border-radius:26px;box-shadow:0 24px 60px rgba(23,23,27,.22), 0 0 0 1px rgba(23,23,27,.07);overflow:hidden}
}
</style>
</helmet>
<template data-dc-template>
<div style="min-height:100vh;display:flex;justify-content:center;font-family:var(--font-body);color:var(--color-text);{{ accentVars }}">
<div class="vn-frame" style="width:100%;max-width:440px;position:relative;padding-bottom:112px;background:#fff">

  <sc-if value="{{ !loaded }}" hint-placeholder-val="{{ false }}">

        <div style="width:64px;height:32px;border-radius:999px" class="skel"></div>
        <div style="width:84px;height:32px;border-radius:999px" class="skel"></div>
        <div style="width:76px;height:32px;border-radius:999px" class="skel"></div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
        <div style="width:92px;height:92px;border-radius:11px;flex:none" class="skel"></div>
        <div style="flex:1">
          <div style="width:70%;height:15px;border-radius:5px" class="skel"></div>
          <div style="width:90%;height:11px;border-radius:5px;margin-top:8px" class="skel"></div>
          <div style="width:60px;height:20px;border-radius:6px;margin-top:9px" class="skel"></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
        <div style="width:92px;height:92px;border-radius:11px;flex:none" class="skel"></div>
        <div style="flex:1">
          <div style="width:70%;height:15px;border-radius:5px" class="skel"></div>
          <div style="width:90%;height:11px;border-radius:5px;margin-top:8px" class="skel"></div>
          <div style="width:60px;height:20px;border-radius:6px;margin-top:9px" class="skel"></div>
        </div>
      </div>
      <div style="display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)">
        <div style="width:92px;height:92px;border-radius:11px;flex:none" class="skel"></div>
        <div style="flex:1">
          <div style="width:70%;height:15px;border-radius:5px" class="skel"></div>
          <div style="width:90%;height:11px;border-radius:5px;margin-top:8px" class="skel"></div>
          <div style="width:60px;height:20px;border-radius:6px;margin-top:9px" class="skel"></div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ loaded }}" hint-placeholder-val="{{ true }}">

  <sc-if value="{{ showSwitcher }}" hint-placeholder-val="{{ false }}">
  <div class="eyebrow" style="display:flex;align-items:center;gap:9px;padding:10px 18px 0;color:var(--color-neutral-600)">
    <span>Ficha do item</span>
    <div class="noscroll" style="display:flex;gap:6px;overflow-x:auto">
      <sc-for list="{{ variants }}" as="v" hint-placeholder-count="3">
        <button onClick="{{ v.onClick }}" style="{{ v.style }}">{{ v.name }}</button>
      </sc-for>
    </div>
  </div>
  </sc-if>

  <div style="position:relative">
    <div style="width:100%;height:128px;overflow:hidden;background:var(--color-surface)">
      <image-slot id="vn-cover" shape="rect" style="width:100%;height:100%" placeholder="Capa da loja" src="{{ coverUrl }}"></image-slot>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(23,23,27,0) 55%, rgba(23,23,27,.30))"></div>
    </div>
  </div>
  <div style="position:relative;padding:8px 20px 18px;margin-top:-24px;background:radial-gradient(120% 100% at 18% 40%, rgba(245,197,23,.10), transparent 60%)">

      <div style="width:92px;height:92px;flex:none;border-radius:50%;padding:4px;background:linear-gradient(160deg, rgba(245,197,23,.65), rgba(230,32,140,.45));box-shadow:0 10px 24px rgba(23,23,27,.16)">

      </div>
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div class="eyebrow" style="display:flex;align-items:center;gap:7px;color:var(--gold-ink)">
            <span style="width:5px;height:5px;border-radius:50%;background:var(--gold-ink)"></span>Adega
          </div>
          <div style="flex:none;display:flex;gap:6px;margin-top:5px">
            <a href="{{ mapHref }}" target="_blank" rel="noopener" aria-label="Localização da adega" style="width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-sm);color:var(--color-text)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </a>
            <a href="{{ instagramHref }}" target="_blank" rel="noopener" aria-label="Instagram" style="width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-sm);color:var(--color-text)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <button onClick="{{ onShare }}" aria-label="Compartilhar" style="width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-sm);color:var(--color-text);cursor:pointer;border:0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
          </div>
        </div>
        <h1 style="font-family:var(--font-heading);font-weight:700;font-size:25px;line-height:1.08;letter-spacing:-.03em;margin:0;color:var(--color-text);text-wrap:balance">
          <span style="color:#17171b">{{ storeNamePart1 }}</span> <span style="color:#17171b">{{ storeNamePart2 }}</span>
        </h1>
      </div>
    </div>
    <div class="desc" style="margin-top:12px;line-height:1.55">{{ tagline }}</div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px">
      <span style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:11.5px;color:#3a3a42;background:#fff;box-shadow:var(--shadow-sm)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.65"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span style="{{ openStatusDotStyle }}"></span>{{ openStatusLabel }}
      </span>
      <span style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:11.5px;color:#3a3a42;background:#fff;box-shadow:var(--shadow-sm)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;opacity:.65"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>

      </span>
      <sc-if value="{{ hasWorkDays }}" hint-placeholder-val="{{ false }}">
        <span style="display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:11.5px;color:#3a3a42;background:#fff;box-shadow:var(--shadow-sm)">

  <div style="{{ searchWrapStyle }}">
    <input class="input" type="text" placeholder="Buscar bebida" value="{{ q }}" onChange="{{ onSearch }}" style="{{ searchInputStyle }}">
  </div>

          <div style="position:relative;border-radius:12px;overflow:hidden">

                <span class="money" style="font-size:10px;color:var(--color-neutral-400);text-decoration:line-through">{{ p.compareLabel }}</span>

            <div class="itemname" style="font-size:12.5px;line-height:1.3;color:var(--color-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ p.name }}</div>
          </div>
        </div>
      </sc-for>
    </div>

  <div key="{{ cat }}" style="{{ groupsAnimStyle }}padding:14px 18px 0">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900},&quot;itemStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Compacta&quot;,&quot;Foto grande&quot;,&quot;Rápida&quot;],&quot;default&quot;:&quot;Compacta&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ficha do item&quot;},&quot;deliveryFee&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:30,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pedido&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5511999347715&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pedido&quot;}}">
/* Se a página recarregar no meio de uma compra, o carrinho não pode sumir —
   por isso ele começa lendo o que sobrou salvo no aparelho do cliente. */
function loadCart() {
  try {
    const saved = JSON.parse(localStorage.getItem('vn.cart'));
    return Array.isArray(saved) ? saved : [];
  } catch (e) { return []; }
}

/* Indicação de amigo: o "código" é o próprio WhatsApp de quem indicou, sem
   cadastro nem código gerado. Chega pela URL (?ref=) e fica guardado até
   virar um pedido de verdade — só grava se ainda não tiver um pendente, pra
   abrir o mesmo link de novo (ou o de outra pessoa) no meio do caminho não
   trocar quem vai ganhar a indicação. */
function captureRef() {
  try {
    const params = new URLSearchParams(location.search);
    const raw = params.get('ref');
    if (!raw) return;
    const digits = raw.replace(/\D/g, '').slice(-11);
    if (digits.length < 10) return;
    if (!localStorage.getItem('vn.ref')) localStorage.setItem('vn.ref', digits);
  } catch (e) {}
}

class Component extends DCLogic {
  state = { doc: null, telefone: '', cat: 'Todos', q: '', open: null, qty: 1, opt: 0, sel: {}, obs: '', flavor: null, flavor2: null, flavorMix: {}, cart: loadCart(), confirmedTotal: null, cartOpen: false, done: false, mode: 'entrega', nome: '', cep: '', rua: '', numero: '', bairro: '', cepStatus: 'idle', addrEdit: false, msg: '', toast: '', variant: null, added: '', addedLineIndex: null, deliveryKm: null, deliveryFeeCalc: null, deliveryCalcStatus: 'idle', photoZoom: false, coupon: '', couponChecking: false, couponCheckUsed: false, couponRedeemed: false, showScrollTop: false, searchCompact: false, waTracked: false, referralOpen: false, referralCount: 0, referralCounting: false };

  get data() {
    const d = this.state.doc;
    if (!d) return [];
    /* d só é substituído por inteiro (nunca mutado no lugar) em cada
       VN.load()/setState({doc}) — então cachear pela referência do doc evita
       reagrupar ~130+ produtos em ~27 categorias de novo a cada leitura
       (chamado 2x por render) quando nada no catálogo mudou. */
    if (this._dataCache && this._dataCacheDoc === d) return this._dataCache;
    const result = d.categories
      .map(c => ({ name: c.name, items: d.products.filter(p => p.catId === c.id && !p.out) }))
      .filter(g => g.items.length);
    this._dataCacheDoc = d;
    this._dataCache = result;
    return result;
  }

  get promoItems() {
    const d = this.state.doc;
    if (!d) return [];
    return d.products.filter(p => p.featured && !p.out);
  }

  /* Arrastar a alça pra baixo fecha a ficha/carrinho — segue o dedo em tempo
     real (sem transição) e só anima de volta pro lugar se soltar sem ter
     arrastado o suficiente. */
  sheetDrag = (e) => {
    const box = e.currentTarget.closest('.sheet-box');
    if (!box) return;
    box.style.transition = 'none';
    const startY = e.clientY;
    const onMove = (ev) => {
      const dy = Math.max(0, ev.clientY - startY);
      box.style.transform = 'translateY(' + dy + 'px)';
    };
    const onUp = (ev) => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      const dy = Math.max(0, ev.clientY - startY);
      if (dy > 80) {
        this.setState({ open: null, cartOpen: false, added: '', referralOpen: false });
      } else {
        box.style.transition = 'transform .2s ease';
        box.style.transform = '';
      }
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  };

  extrasFor(it) {
    const d = this.state.doc;
    if (!d || !it) return [];
    const ids = (it.upsell || []).concat(d.settings.globalUpsell || []);
    const seen = {};
    return ids
      .filter(id => id !== it.id && !seen[id] && (seen[id] = 1))
      .map(id => d.products.find(p => p.id === id))
      .filter(p => p && !p.out)
      /* Carrega o id: a seleção de adicionais é indexada por ele, não pelo
         nome — a coleção "Mais vendidos" repete o nome de produtos que já
         existem em outras coleções, e por nome dois adicionais diferentes
         viravam a mesma chave (mexer num mexia no outro, e o preço entrava
         em dobro no total). */
      .map(p => ({ id: p.id, name: p.name, price: p.price }));
  }

  seedData = [
    { name: 'Cervejas', items: [
      { id: 'cv1', name: 'Skol fina 269ml', vol: 'Garrafa 269ml', price: 3.5, fardos: [[15, 42]] },
      { id: 'cv2', name: 'Skol 350ml', vol: 'Lata 350ml', price: 5, fardos: [[12, 45], [15, 56.5]] },
      { id: 'cv3', name: 'Itaipava fina 269ml', vol: 'Garrafa 269ml', price: 3.5, fardos: [[12, 30], [15, 37.5]] },

  extras = {};

  componentDidMount() {
    captureRef();
    this._onScroll = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const show = y > 480;
      const compact = y > 90;
      const patch = {};
      if (show !== this._scrollTopShown) { this._scrollTopShown = show; patch.showScrollTop = show; }
      if (compact !== this._searchCompact) { this._searchCompact = compact; patch.searchCompact = compact; }
      if (Object.keys(patch).length) this.setState(patch);
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    /* No celular, apertar o botão físico de "voltar" com uma ficha/carrinho aberto
       fechava o site inteiro em vez de só a ficha (não tinha nada no histórico do
       navegador pra "voltar" — o "voltar" saía direto da página). Escuta o evento
       de navegação e fecha a ficha aberta em vez de deixar o navegador sair. */
    this._histDepth = 0;
    this._onPopState = () => {
      if (this._histDepth <= 0) return;
      this._histDepth--;
      this._closingFromPopstate = true;
      const s = this.state;
      if (s.photoZoom) {
        this.setState({ photoZoom: false });
      } else if (s.done) {
        this._waTracking = false;
        this.setState({ done: false, cart: [], nome: '', telefone: '', cep: '', rua: '', numero: '', bairro: '', cepStatus: 'idle', addrEdit: false, msg: '', coupon: '', couponRedeemed: false, waTracked: false, deliveryKm: null, deliveryFeeCalc: null, deliveryCalcStatus: 'idle', confirmedTotal: null });
      } else {
        this.setState({ open: null, cartOpen: false, added: '', photoZoom: false, referralOpen: false });
      }
    };
    window.addEventListener('popstate', this._onPopState);
    const boot = () => {
      if (!window.VN) return setTimeout(boot, 60);
      VN.load().then(r => {
        this.setState({ doc: r.doc });
        if (VN.checkUpdated) VN.checkUpdated().then(u => { this._lastUpdatedAt = u; });
      });
      /* Antes, cada tick baixava o catálogo inteiro (fácil 50-100KB com fotos
         de 130+ produtos) e serializava (JSON.stringify) o doc novo E o velho
         só pra comparar igualdade — a cada 6s, pra sempre. Agora só pergunta
         o "updated_at" (resposta minúscula) e só baixa/serializa o documento
         de verdade quando ele realmente mudou. */
      this._poll = setInterval(() => {
        if (document.hidden) return;
        if (!VN.checkUpdated) {
          return VN.load().then(r => {
            const a = JSON.stringify(r.doc), b = JSON.stringify(this.state.doc);
            if (a !== b) this.setState({ doc: r.doc });
          });
        }
        VN.checkUpdated().then(u => {
          if (u === null || u === this._lastUpdatedAt) return;
          this._lastUpdatedAt = u;
          VN.load().then(r => this.setState({ doc: r.doc }));
        });
      }, 6000);
      this._vis = () => {
        if (!document.hidden) VN.load().then(r => this.setState({ doc: r.doc }));
      };
      document.addEventListener('visibilitychange', this._vis);
      this._storage = (e) => {
        if (e.key === 'vn.doc') VN.load().then(r => this.setState({ doc: r.doc }));
      };
      window.addEventListener('storage', this._storage);
    };
    boot();
  }



  componentDidUpdate() {
    /* No celular, deixar a página de fundo ainda rolando com uma ficha fixa por cima
       causa um bug visual de "fantasma" (o Safari/iOS repinta errado durante o scroll).
       Trava o scroll do body enquanto qualquer ficha/carrinho estiver aberto. */
    const s = this.state;
    const anyOpen = !!s.open || s.cartOpen || !!s.added || s.done || s.referralOpen;
    /* Empurra uma entrada no histórico assim que alguma ficha abre — é o que dá
       ao "voltar" do celular algo pra consumir em vez de sair da página direto.
       O zoom da foto ganha uma segunda camada própria (abre por cima de uma
       ficha já aberta) pra o primeiro "voltar" fechar só o zoom, não tudo de
       uma vez. Se a ficha foi fechada pelo próprio app (botão "Fechar" etc,
       não pelo botão físico de voltar), consome as entradas puxando
       history.go() sozinho, senão o histórico ficava desalinhado e o próximo
       "voltar" não fazia nada visível. */
    const desiredHistDepth = anyOpen ? (s.photoZoom ? 2 : 1) : 0;
    if (desiredHistDepth > this._histDepth) {
      for (let i = this._histDepth; i < desiredHistDepth; i++) history.pushState({ vnSheet: true }, '');
      this._histDepth = desiredHistDepth;
    } else if (desiredHistDepth < this._histDepth && !this._closingFromPopstate) {
      const diff = this._histDepth - desiredHistDepth;
      this._histDepth = desiredHistDepth;
      history.go(-diff);
    }
    this._closingFromPopstate = false;
    if (anyOpen && !this._scrollLocked) {
      this._scrollY = window.scrollY;
      document.body.style.position = 'fixed';
      document.body.style.top = '-' + this._scrollY + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
      document.body.style.width = '100%';
      this._scrollLocked = true;
    } else if (!anyOpen && this._scrollLocked) {
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.left = '';
      document.body.style.right = '';
      document.body.style.width = '';
      window.scrollTo(0, this._scrollY || 0);
      this._scrollLocked = false;
    }

    if (s.cart !== this._prevCart) {
      this._prevCart = s.cart;
      try { localStorage.setItem('vn.cart', JSON.stringify(s.cart)); } catch (e) {}
    }
  }

  componentWillUnmount() {
    clearInterval(this._poll);
    if (this._vis) document.removeEventListener('visibilitychange', this._vis);
    if (this._storage) window.removeEventListener('storage', this._storage);
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
    if (this._onPopState) window.removeEventListener('popstate', this._onPopState);
  }

  fmt(v) { return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ','); }

  /* "A partir de" antes de escolher variante: se pelo menos um sabor tiver
     preço próprio, mostra o MENOR preço configurado em vez do preço base do
     produto — senão o cliente via um valor que nunca é realmente vendido
     (ex: R$1,00 de cadastro num produto cujas variantes custam R$12+). */
  minVariantPrice(it) {
    /* Combo (comboQty>0) tem UM preço fixo só — preço por sabor cadastrado
       nesse modo é ignorado (a ficha nem usa), então não faz sentido puxar
       ele aqui também. */
    if (Math.round(Number(it.comboQty) || 0) > 0) return it.price;
    const prices = (it.flavors || [])
      .map(f => (f && typeof f === 'object' && f.price != null && f.price !== '') ? Number(f.price) : null)
      .filter(v => v != null);
    return prices.length ? Math.min.apply(null, prices) : it.price;
  }

  optsOf(it, priceOverride) {
    const list = [{ label: 'Unidade', price: priceOverride != null ? priceOverride : it.price, each: '' }];
    (it.fardos || []).forEach(f => list.push({
      label: 'Fardo ' + f[0] + ' un', price: f[1], each: this.fmt(f[1] / f[0]) + ' cada'
    }));
    return list;
  }

  openItem(it, cat) {
    if (window.VN) VN.track('click', { product: it.name, qty: 1, total: it.price });
    if (this.variant() === 'Rápida' && !(it.flavors && it.flavors.length)) return this.quickAdd(it);
    /* Não pré-seleciona nenhum sabor — o cliente precisa escolher de
       propósito. Com um sabor já vindo marcado, dava pra adicionar ao
       pedido sem perceber que "Melancia" (ou o primeiro da lista) tinha
       sido escolhido. */
    this.setState({ open: Object.assign({}, it, { cat: cat }), qty: 1, opt: 0, sel: {}, obs: '', flavor: null, flavor2: null, flavorMix: {}, cartOpen: false, added: '', photoZoom: false });
  }

  quickAdd(it) {
    /* Produto com sabores/variantes sempre abre a ficha — precisa de uma
       escolha explícita, então não dá pra supor um sabor sozinho no toque
       rápido do "+". */
    if (it.flavors && it.flavors.length) return this.openItem(it, (this.data.find(g => g.items.some(x => x.id === it.id)) || {}).name);
    /* Comparava l.name === it.name, mas a linha nova é salva como
       it.name + ' · unidade' — nunca batia, então cada toque no "+" rápido
       (variante "Rápida" e cards de promoção) criava uma linha duplicada em
       vez de somar 1 na já existente. simpleLineIndex já resolve isso certo
       (compara pid, preço e ausência de extras/obs) e é o mesmo critério
       usado pelo stepper da lista. */
    this.setState(st => {
      const i = this.simpleLineIndex(st.cart, it);
      const cart = i >= 0
        ? st.cart.map((l, j) => j === i ? Object.assign({}, l, { qty: l.qty + 1 }) : l)
        : st.cart.concat([{ name: it.name + ' · unidade', unit: it.price, qty: 1, obs: '', extras: [], photo: it.photo || '', pid: it.id }]);
      return { cart: cart, added: it.name, addedLineIndex: i >= 0 ? i : cart.length - 1, open: null, cartOpen: false };
    });
  }

  variant() {
    const cfg = (this.state.doc && this.state.doc.settings) || {};
    return this.state.variant || cfg.itemStyle || this.props.itemStyle || 'Compacta';
  }

  unitOf(it, sel, opt, priceOverride) {
    const list = this.extrasFor(it);
    const optList = this.optsOf(it, priceOverride);
    const o = optList[opt] || optList[0];
    return o.price + list.reduce((t, a) => t + (sel[a.id] || 0) * a.price, 0);
  }

  bump(i, d) {
    this.setState(st => ({ cart: st.cart.map((l, j) => j === i ? Object.assign({}, l, { qty: Math.max(1, l.qty + d) }) : l) }));
  }

  /* Igual ao "−/+" da lista principal (bumpSimple): chegar a 0 remove a linha
     em vez de travar em 1 — antes só o carrinho tinha esse comportamento
     diferente do resto do app, obrigando a usar "Remover" à parte. */
  bumpLine(i, d) {
    this.setState(st => {
      const l = st.cart[i];
      if (!l) return null;
      const qty = l.qty + d;
      if (qty <= 0) return { cart: st.cart.filter((x, j) => j !== i) };
      return { cart: st.cart.map((x, j) => j === i ? Object.assign({}, x, { qty: qty }) : x) };
    });
  }

  /* Stepper direto na lista: só mexe na linha "unidade" simples (sem fardo,
     adicional ou observação) — pra qualquer outra variação, o cliente ainda
     precisa abrir a ficha, que é onde essas escolhas fazem sentido. */
  simpleLineIndex(cart, it) {
    return cart.findIndex(l => l.pid === it.id && l.unit === it.price && !l.extras.length && !l.obs);
  }

  bumpSimple(it, delta) {
    this.setState(st => {
      const i = this.simpleLineIndex(st.cart, it);
      if (i < 0) {
        if (delta <= 0) return null;
        return { cart: st.cart.concat([{ name: it.name + ' · unidade', unit: it.price, qty: 1, obs: '', extras: [], photo: it.photo || '', pid: it.id }]) };
      }
      const qty = st.cart[i].qty + delta;
      return { cart: qty <= 0 ? st.cart.filter((_, j) => j !== i) : st.cart.map((l, j) => j === i ? Object.assign({}, l, { qty: qty }) : l) };
    });
  }

  buildMsg(subtotal, feeVal, couponDiscount, couponCode) {
    const s = this.state, fmt = this.fmt.bind(this);
    const rows = s.cart.map(l => l.qty + 'x ' + l.name + (l.extras.length ? ' (+ ' + l.extras.join(', ') + ')' : '') + (l.obs ? ' — ' + l.obs : '') + '  ' + fmt(l.unit * l.qty));
    const out = ['*Pedido — Vai Nessa Adega*', ''].concat(rows, ['',
      'Subtotal: ' + fmt(subtotal)
    ]);
    if (couponDiscount > 0) out.push('Cupom (' + couponCode + '): -' + fmt(couponDiscount));
    out.push(
      (s.mode === 'entrega' ? 'Entrega: ' + fmt(feeVal) : 'Retirada na adega'),
      'Total: ' + fmt(subtotal - couponDiscount + feeVal), '',
      'Nome: ' + (s.nome || '—'),
      'WhatsApp: ' + (s.telefone || '—')
    );
    if (s.mode === 'entrega') out.push('Endereço: ' + (this.fullAddress() || '—'));
    return out.join('\n');
  }

  fullAddress() {
    const s = this.state;
    const ruaNum = [s.rua, s.numero].filter(Boolean).join(', ');
    return [ruaNum, s.bairro, s.cep].filter(Boolean).join(' - ');
  }

  geocodeAddress() {
    const s = this.state;
    const ruaNum = [s.rua, s.numero].filter(Boolean).join(', ');
    return [ruaNum, s.bairro].filter(Boolean).join(', ');
  }

  /* Confere no servidor se esse WhatsApp já usou esse cupom antes (1 uso por
     número). Memoiza por telefone+código pra não bater na função a cada
     tecla — só dispara de novo quando o par muda de verdade. */
  scheduleCouponCheck(phone, code) {
    const digits = String(phone || '').replace(/\D/g, '');
    const key = digits + '|' + code.toUpperCase();
    if (this._couponCheckKey === key) return;
    this._couponCheckKey = key;
    clearTimeout(this._couponTimer);
    if (digits.length < 10) { this.setState({ couponChecking: false, couponCheckUsed: false }); return; }
    this.setState({ couponChecking: true });
    this._couponTimer = setTimeout(() => {
      (window.VN ? VN.couponUsed(digits, code) : Promise.resolve(false)).then(used => {
        if (this._couponCheckKey !== key) return;
        this.setState({ couponChecking: false, couponCheckUsed: used });
      });
    }, 450);
  }

  /* Conta em tempo real quantos amigos esse WhatsApp já indicou, pra mostrar
     o progresso "1/5/10/25 indicações" na própria ficha — mesma lógica de
     memoização do cupom acima, só dispara de novo quando o telefone muda
     de verdade. */
  scheduleReferralCount(phone) {
    const digits = String(phone || '').replace(/\D/g, '').slice(-11);
    if (this._refCountKey === digits) return;
    this._refCountKey = digits;
    clearTimeout(this._refCountTimer);
    if (digits.length < 10) { this.setState({ referralCounting: false, referralCount: 0 }); return; }
    /* Zera o contador junto (não só marca "carregando") — senão, ao trocar
       de telefone, os selos de prêmio ficavam mostrando o progresso do
       número anterior por baixo do texto "Verificando…" até a resposta
       nova chegar. */
    this.setState({ referralCounting: true, referralCount: 0 });
    this._refCountTimer = setTimeout(() => {
      (window.VN ? VN.countReferrals(digits) : Promise.resolve(0)).then(n => {
        if (this._refCountKey !== digits) return;
        this.setState({ referralCounting: false, referralCount: n || 0 });
      });
    }, 450);
  }

  scheduleDeliveryCalc(storeAddress, pricePerKm, kmOn) {
    if (!kmOn) return;
    clearTimeout(this._addrTimer);
    this.setState({ deliveryCalcStatus: 'loading' });
    this._addrTimer = setTimeout(() => {
      const q = this.geocodeAddress();
      if (q.trim().length > 6) this.calcDelivery(storeAddress, q, pricePerKm);
      else this.setState({ deliveryCalcStatus: 'idle' });
    }, 900);
  }

  lookupCep(cep, storeAddress, pricePerKm, kmOn) {
    const digits = cep.replace(/\D/g, '');
    if (digits.length !== 8) return;
    this.setState({ cepStatus: 'loading' });
    fetch('https://viacep.com.br/ws/' + digits + '/json/')
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d || d.erro) return this.setState({ cepStatus: 'error' });
        this.setState(st => ({
          cepStatus: 'ok',
          rua: d.logradouro || st.rua,
          bairro: d.bairro || st.bairro
        }));
        this.scheduleDeliveryCalc(storeAddress, pricePerKm, kmOn);
      })
      .catch(() => this.setState({ cepStatus: 'error' }));
  }

  /* fetch sem timeout pode ficar pendurado pra sempre se o servidor não responder
     nem dá erro (trava a tela em "calculando..." indefinidamente). Aborta sozinho
     depois de alguns segundos pra sempre cair no fallback/erro em vez de travar. */
  fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms || 7000);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
  }

  /* CEP brasileiro já localiza o endereço com bastante precisão sozinho — a BrasilAPI
     devolve lat/lng calculado a partir do próprio CEP na maioria dos casos, numa única
     chamada rápida e sem limite de 1 req/s (diferente do Nominatim). Muito mais rápido
     e mais preciso que tentar geocodificar rua/bairro digitado por texto livre. */
  geocodeByCep(cep) {
    const digits = String(cep || '').replace(/\D/g, '');
    if (digits.length !== 8) return Promise.resolve(null);
    const url = 'https://brasilapi.com.br/api/cep/v2/' + digits;
    return this.fetchWithTimeout(url, 6000).then(r => r.ok ? r.json() : null).then(d => {
      const c = d && d.location && d.location.coordinates;
      const lat = c && parseFloat(c.latitude), lng = c && parseFloat(c.longitude);
      return (lat && lng) ? { lat: lat, lng: lng } : null;
    }).catch(() => null);
  }

  geocode(address) {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=' + encodeURIComponent(address);
    return this.fetchWithTimeout(url, 7000).then(r => r.ok ? r.json() : []).then(rows => {
      if (!rows || !rows.length) return null;
      return { lat: parseFloat(rows[0].lat), lng: parseFloat(rows[0].lon) };
    }).catch(() => null);
  }

  /* Busca estruturada (rua + número + CEP) em vez de um texto só — o Nominatim casa cada
     pedaço com o campo certo do endereço em vez de tentar adivinhar, então é bem mais
     exato quando temos o CEP. Prioriza o CEP puro (a área certa quase sempre bate) e
     refina com a rua/número quando dá certo. */
  geocodeStructured(rua, numero, cep) {
    const params = new URLSearchParams({ format: 'json', limit: '1', countrycodes: 'br' });
    const street = [numero, rua].filter(Boolean).join(' ').trim();
    if (street) params.set('street', street);
    const digits = String(cep || '').replace(/\D/g, '');
    if (digits.length === 8) params.set('postalcode', digits.slice(0, 5) + '-' + digits.slice(5));
    params.set('country', 'Brazil');
    if (!street && !digits) return Promise.resolve(null);
    const url = 'https://nominatim.openstreetmap.org/search?' + params.toString();
    return this.fetchWithTimeout(url, 7000).then(r => r.ok ? r.json() : []).then(rows => {
      if (!rows || !rows.length) return null;
      return { lat: parseFloat(rows[0].lat), lng: parseFloat(rows[0].lon) };
    }).catch(() => null);
  }

  /* Bairros digitados de forma informal (ex: "Cidade Nova São Miguel", "Jardim Nair")
     às vezes não batem com o nome oficial no OpenStreetMap. Se a busca completa falhar,
     tenta de novo com menos detalhe — rua + número + cidade, depois só rua + cidade —
     até achar alguma coisa. Uma pausa entre tentativas por causa do limite de uso do Nominatim. */
  geocodeWithFallback(address) {
    const parts = address.split(',').map(s => s.trim()).filter(Boolean);
    const last = parts[parts.length - 1];
    const candidates = [address];
    if (parts.length >= 3) {
      const withNumber = [parts[0], parts[1], last].join(', ');
      if (!candidates.includes(withNumber)) candidates.push(withNumber);
    }
    if (parts.length >= 2) {
      const streetOnly = [parts[0], last].join(', ');
      if (!candidates.includes(streetOnly)) candidates.push(streetOnly);
    }
    const tryNext = i => {
      if (i >= candidates.length) return Promise.resolve(null);
      const attempt = i === 0 ? this.geocode(candidates[i]) : new Promise(r => setTimeout(r, 600)).then(() => this.geocode(candidates[i]));
      return attempt.then(g => g || tryNext(i + 1));
    };
    return tryNext(0);
  }

  routeKm(a, b) {
    const url = 'https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=false';
    return this.fetchWithTimeout(url, 7000).then(r => r.ok ? r.json() : null).then(data => {
      const route = data && data.routes && data.routes[0];
      return route ? route.distance / 1000 : null;
    }).catch(() => null);
  }

  showToast(msg) {
    clearTimeout(this._toastTimer);
    this.setState({ toast: msg });
    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 2600);
  }

  /* Aberto/fechado de verdade, calculado no fuso de São Paulo — antes a
     bolinha verde era só decoração, sempre acesa, mesmo fora do horário.
     Sem os campos novos configurados (openWeekday etc.), volta pro texto
     fixo de sempre em vez de quebrar. */
  computeOpenStatus(cfg) {
    const openStr = s => (s || '').trim();
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Sao_Paulo', hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit'
    }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => { map[p.type] = p.value; });
    const weekdayMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
    const day = weekdayMap[map.weekday];
    const isWeekend = day === 0 || day === 6;
    const openT = openStr(isWeekend ? cfg.openWeekend : cfg.openWeekday);
    const closeT = openStr(isWeekend ? cfg.closeWeekend : cfg.closeWeekday);
    if (!openT || !closeT) return null;
    const toMin = t => { const bits = t.split(':'); return (parseInt(bits[0], 10) || 0) * 60 + (parseInt(bits[1], 10) || 0); };
    const openMin = toMin(openT);
    let closeMin = toMin(closeT);
    if (closeMin <= openMin) closeMin += 1440;
    const nowMinRaw = (parseInt(map.hour, 10) || 0) * 60 + (parseInt(map.minute, 10) || 0);
    /* Quando o fechamento vira o dia (ex: abre 18h, fecha 2h), a madrugada
       (00:00–02:00) tem um horário "pequeno" que já é o dia seguinte — sem
       esse ajuste, comparar direto com openMin/closeMin dava "fechado" a
       noite inteira depois da meia-noite mesmo com a loja aberta. */
    const nowMin = (closeMin > 1440 && nowMinRaw < openMin) ? nowMinRaw + 1440 : nowMinRaw;
    const isOpen = nowMin >= openMin && nowMin < closeMin;
    const fmtT = t => t.replace(/^0/, '').replace(':00', 'h').replace(':', 'h');
    return {
      isOpen: isOpen,
      label: isOpen ? ('Aberto agora · fecha às ' + fmtT(closeT)) : ('Fechado agora · abre às ' + fmtT(openT))
    };
  }

  /* Arredonda o frete pra um valor redondo em vez de centavos exatos:
     menos de 25 centavos cai pro real cheio, 25 a 69 vira ",50", 70+ sobe pro próximo real. */
  roundFee(v) {
    const whole = Math.floor(v);
    const cents = Math.round((v - whole) * 100);
    if (cents < 25) return whole;
    if (cents < 70) return whole + 0.5;
    return whole + 1;
  }

  normalizeForGeocode(addr) {
    const a = addr.replace(/\s*[—–]\s*/g, ', ').trim();
    return /s(ã|a)o paulo/i.test(a) ? a : a + ', São Paulo - SP';
  }

  calcDelivery(storeAddressRaw, custAddressRaw, pricePerKm) {
    const storeAddress = this.normalizeForGeocode(storeAddressRaw);
    const custAddress = this.normalizeForGeocode(custAddressRaw);
    const key = storeAddress + '|' + custAddress;
    if (this._deliveryCalcKey === key) {
      /* Mesmo endereço de uma chamada anterior que já terminou — quem chamou
         (scheduleDeliveryCalc) já marcou "loading" de novo antes de chegar
         aqui; sem restaurar o resultado conhecido, a tela ficava presa em
         "calculando..." pra sempre porque nada mais ia rodar pra essa key. */
      if (this._deliveryCalcResult) this.setState(this._deliveryCalcResult);
      return;
    }
    this._deliveryCalcKey = key;
    this._deliveryCalcResult = null;
    const setDeliveryState = patch => { this._deliveryCalcResult = patch; this.setState(patch); };
    this.setState({ deliveryCalcStatus: 'loading' });
    const wait = ms => new Promise(r => setTimeout(r, ms));
    /* Trava de segurança: se por algum motivo a cadeia de geocoding nunca resolver
       (rede engasgada, provedor fora do ar sem nem devolver erro), força "erro" depois
       de um tempo em vez de deixar "calculando..." preso na tela pra sempre. */
    clearTimeout(this._deliveryWatchdog);
    this._deliveryWatchdog = setTimeout(() => {
      if (this._deliveryCalcKey === key && this.state.deliveryCalcStatus === 'loading') {
        setDeliveryState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
      }
    }, 16000);
    /* Nominatim pede no máx. ~1 req/s da mesma origem — chamadas em paralelo
       às vezes voltam vazias. Só espera 600ms antes da próxima chamada quando
       a de origem (endereço da loja) realmente acabou de ser feita — se já
       veio do cache (o caso comum, depois da primeira vez na sessão), não tem
       requisição anterior pra espaçar e a pausa só deixava tudo mais lento
       à toa. */
    /* O CEP sozinho (BrasilAPI) é rápido mas às vezes só devolve o centro aproximado
       de uma região inteira — pode errar por vários km num bairro grande ou CEP
       antigo compartilhado por várias ruas. Rua + número é sempre mais exato porque
       casa um endereço específico, então vai primeiro; o CEP isolado entra só como
       atalho de reserva antes da busca por texto livre (mais lenta e menos exata). */
    const numFrom = addr => { const m = addr.match(/,\s*(\d+)/); return m ? m[1] : ''; };
    const streetFrom = addr => addr.split(',')[0].trim();
    const storeCached = this._storeGeoCache && this._storeGeoAddr === storeAddress;
    const storeGeo = storeCached
      ? Promise.resolve(this._storeGeoCache)
      : this.geocodeStructured(streetFrom(storeAddressRaw), numFrom(storeAddressRaw), this._storeCep)
          .then(g => g || this.geocodeByCep(this._storeCep))
          .then(g => g || this.geocodeWithFallback(storeAddress))
          .then(g => { this._storeGeoCache = g; this._storeGeoAddr = storeAddress; return g; });
    const destCacheKey = s => s.rua.trim() + '|' + s.numero.trim() + '|' + s.cep.trim();
    storeGeo.then(origin => {
      if (this._deliveryCalcKey !== key) return;
      if (!origin) return setDeliveryState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
      const s = this.state;
      const dKey = destCacheKey(s);
      const destCached = this._destGeoCache && this._destGeoKey === dKey;
      const gate = storeCached ? Promise.resolve() : wait(600);
      const destGeo = destCached
        ? Promise.resolve(this._destGeoCache)
        : gate
          .then(() => this.geocodeStructured(s.rua, s.numero, s.cep))
          .then(dest => dest || this.geocodeByCep(s.cep))
          .then(dest => dest || wait(600).then(() => this.geocodeWithFallback(custAddress)))
          .then(dest => { if (dest) { this._destGeoCache = dest; this._destGeoKey = dKey; } return dest; });
      return destGeo.then(dest => {
        if (this._deliveryCalcKey !== key) return;
        if (!dest) return setDeliveryState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
        return this.routeKm(origin, dest).then(km => {
          if (this._deliveryCalcKey !== key) return;
          if (km == null) return setDeliveryState({ deliveryCalcStatus: 'error', deliveryKm: null, deliveryFeeCalc: null });
          setDeliveryState({ deliveryCalcStatus: 'ok', deliveryKm: km, deliveryFeeCalc: this.roundFee(km * pricePerKm) });
        });
      });
    });
  }

  renderVals() {
    const s = this.state, fmt = this.fmt.bind(this), V = this.variant();
    const cfg = (s.doc && s.doc.settings) || {};
    const openStatus = this.computeOpenStatus(cfg);
    const flatFee = cfg.deliveryFee != null ? cfg.deliveryFee : (this.props.deliveryFee != null ? this.props.deliveryFee : 8);
    const pricePerKm = cfg.pricePerKm != null ? Number(cfg.pricePerKm) || 0 : 4;
    const kmOn = cfg.kmDelivery !== false;
    const fee = (kmOn && s.deliveryCalcStatus === 'ok' && s.deliveryFeeCalc != null) ? s.deliveryFeeCalc : flatFee;
    const phone = cfg.whatsapp || this.props.whatsapp || '5511999347715';
    const formatBrPhone = raw => {
      const d = String(raw || '').replace(/\D/g, '').slice(-11);
      if (d.length === 11) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
      if (d.length === 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
      return raw;
    };
    const instaRaw = (cfg.instagram || '@vai.nessa1.0__').trim();
    const instagramHref = /^https?:\/\//i.test(instaRaw) ? instaRaw : 'https://www.instagram.com/' + instaRaw.replace(/^@/, '') + '/';
    const instaDisplay = /^https?:\/\//i.test(instaRaw)
      ? instaRaw.replace(/^https?:\/\/(www\.)?instagram\.com\//i, '@').replace(/\/$/, '')
      : (instaRaw.startsWith('@') ? instaRaw : '@' + instaRaw);
    const freeAbove = Number(cfg.freeAbove) || 0;
    const maxDeliveryKm = Number(cfg.maxDeliveryKm) || 0;
    const freeDeliveryMaxKm = Number(cfg.freeDeliveryMaxKm) || 0;
    const address = cfg.address || 'Rua Moacir Dantas Itapicuru, 911 — Cidade Nova São Miguel Paulista';
    const addrParts = address.split(/\s+[—-]\s+/);
    this._storeCep = cfg.storeCep || '';

    const pill = 'flex:none;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:13px;padding:9px 16px;border-radius:999px;';
    const onSt = 'border:1px solid var(--color-accent);color:#fff;background:var(--color-accent);box-shadow:0 4px 12px rgba(216,27,132,.28)';
    const offSt = 'border:1px solid var(--line);color:var(--color-neutral-500);background:#fff';

    const variants = ['Compacta', 'Foto grande', 'Rápida'].map(v => ({
      name: v,
      style: 'flex:none;cursor:pointer;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:transparent;' + (v === V ? 'border:1px solid var(--color-accent);color:var(--color-accent)' : 'border:1px solid var(--line);color:var(--color-neutral-600)'),
      onClick: () => this.setState({ variant: v, open: null })
    }));

    const cats = ['Todos'].concat(this.data.map(g => g.name));
    const tabs = cats.map((c, i) => ({
      name: c, style: pill + (c === s.cat ? onSt : offSt),
      onClick: () => this.setState({ cat: c, catDir: i >= cats.indexOf(s.cat) ? 'r' : 'l' })
    }));
    const groupsAnimStyle = 'animation:' + (s.catDir === 'l' ? 'slideInLeft' : 'slideInRight') + ' .28s cubic-bezier(.2,.8,.2,1);';

    const q = s.q.trim().toLowerCase();
    const match = it => !q || (it.name + ' ' + (it.vol || '')).toLowerCase().includes(q);
    const quick = V === 'Rápida';
    const plusStyle = 'width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:16px;line-height:1;margin-top:29px;' + (quick
      ? 'border:1px solid var(--color-accent);color:var(--color-accent);background:rgba(216,27,132,.08)'
      : 'border:1px solid var(--line);color:var(--color-accent)');
    /* Monta o mapa pid+preço→qtd uma vez só em vez de rodar cart.findIndex()
       (percorrendo o carrinho inteiro) pra cada um dos 130+ produtos — era
       O(produtos × itens no carrinho) a cada render, agora é uma leitura O(1)
       por produto. */
    const simpleCartQty = new Map();
    s.cart.forEach(l => {
      if (!l.extras.length && !l.obs) simpleCartQty.set(l.pid + '|' + l.unit, l.qty);
    });
    const groups = this.data
      .filter(g => s.cat === 'Todos' || g.name === s.cat)
      .map(g => {
        const items = g.items.filter(match).map(it => {
          return {
            name: it.name, tag: it.tag,
            desc: [it.vol].concat((it.fardos || []).map(f => 'fardo ' + f[0] + ' un ' + fmt(f[1]))).join(' · '),
            priceLabel: fmt(this.minVariantPrice(it)) + ' un',
            slotId: 'vn-' + it.id, photoUrl: it.photo || '', plusStyle: plusStyle, plusLabel: '+',
            onOpen: () => this.openItem(it, g.name),
            rowQty: (it.flavors && it.flavors.length) ? 0 : (simpleCartQty.get(it.id + '|' + it.price) || 0),
            /* onQuickAdd é só pro primeiro toque (ainda não tá no carrinho) —
               usa quickAdd (mostra o toast de confirmação). Depois que já tem
               uma linha, os toques no stepper usam bumpSimple, sem toast:
               o número mudando ali já é a confirmação. */
            onQuickAdd: e => { e.stopPropagation(); this.quickAdd(it); },
            onRowInc: e => { e.stopPropagation(); this.bumpSimple(it, 1); },
            onRowDec: e => { e.stopPropagation(); this.bumpSimple(it, -1); }
          };
        });
        return { name: g.name, count: items.length + (items.length === 1 ? ' item' : ' itens'), items: items };
      })
      .filter(g => g.items.length);

    const open = s.open;
    const promos = this.promoItems.map(p => ({
      name: p.name, desc: [p.vol].concat((p.fardos || []).map(f => 'fardo ' + f[0] + ' un ' + fmt(f[1]))).join(' · '),
      priceLabel: fmt(this.minVariantPrice(p)) + ' un',
      hasCompare: (Number(p.compare) || 0) > p.price, compareLabel: fmt(Number(p.compare) || 0),
      slotId: 'vn-promo-' + p.id, photoUrl: p.photo || '',
      onOpen: () => this.openItem(p, (this.data.find(g => g.items.some(it => it.id === p.id)) || {}).name),
      onAdd: e => { e.stopPropagation(); this.quickAdd(p); }
    }));
    const extras = open ? this.extrasFor(open) : [];
    /* Limite de adicionais é por produto e conta TIPOS diferentes escolhidos,
       não a quantidade de cada um — "até 2" deixa escolher 2x do mesmo
       adicional, só não deixa somar um terceiro tipo diferente. Aumentar a
       quantidade de um adicional já escolhido continua liberado mesmo no
       limite, só bloqueia começar um tipo novo. */
    const maxExtras = Number(open && open.maxExtras) || 0;
    const distinctExtrasSelected = extras.filter(a => (s.sel[a.id] || 0) > 0).length;
    const extrasLimitReached = maxExtras > 0 && distinctExtrasSelected >= maxExtras;
    const extrasLimitHint = maxExtras > 0 ? ('Escolha até ' + maxExtras + ' (' + distinctExtrasSelected + ' de ' + maxExtras + ')') : '';
    const addons = extras.map(a => {
      const hasQty = (s.sel[a.id] || 0) > 0;
      const blocked = extrasLimitReached && !hasQty;
      return {
        name: a.name, priceLabel: '+ ' + fmt(a.price), qty: s.sel[a.id] || 0, hasQty: hasQty,
        incStyle: blocked ? 'opacity:.35;cursor:not-allowed' : '',
        onInc: blocked
          ? () => this.showToast('Escolha até ' + maxExtras + ' adicionais nesse produto.')
          : () => this.setState(st => { const sel = Object.assign({}, st.sel); sel[a.id] = (sel[a.id] || 0) + 1; return { sel: sel }; }),
        onDec: () => this.setState(st => { const sel = Object.assign({}, st.sel); sel[a.id] = Math.max(0, (sel[a.id] || 0) - 1); return { sel: sel }; })
      };
    });
    /* Sabor/variante pode ter um preço próprio (ex: "Copo 500ml"/"770ml"/"1L"
       com valores diferentes) — quando não definido, cai no preço base do
       produto, então isso não muda nada pra sabor que é só sabor mesmo. */
    const flavorList = ((open && open.flavors) || []).map(f => typeof f === 'string'
      ? { name: f, out: false, price: null, max: null, group: '', groupMax: null }
      : {
        name: (f && f.name) || '', out: !!(f && f.out),
        price: (f && f.price != null && f.price !== '') ? Number(f.price) : null,
        max: (f && f.max != null && f.max !== '') ? Math.round(Number(f.max)) : null,
        group: (f && f.group) || '',
        groupMax: (f && f.groupMax != null && f.groupMax !== '') ? Math.round(Number(f.groupMax)) : null
      });
    /* Combo com quantidade fixa (ex: "5 latas, escolha os sabores de cada")
       — em vez de escolher UM sabor pro produto inteiro, o cliente distribui
       uma quantidade fixa entre vários sabores diferentes. Só existe um
       preço pro combo inteiro, então não usa preço por sabor nesse modo. */
    const comboQty = Math.round(Number(open && open.comboQty) || 0);
    const isCombo = flavorList.length > 0 && comboQty > 0;
    const selectedFlavorObj = flavorList.find(f => f.name === s.flavor);
    /* Antes de escolher um sabor, se pelo menos um tiver preço próprio, mostra
       o MENOR preço configurado em vez do preço base do produto — senão o
       cliente via "R$1,00" num produto cujas variantes de verdade custam
       R$12+ (o preço base virou só um valor de cadastro, nunca vendido). */
    const flavorPricesConfigured = flavorList.filter(f => f.price != null).map(f => f.price);
    const minFlavorPrice = flavorPricesConfigured.length ? Math.min.apply(null, flavorPricesConfigured) : null;
    const flavorPriceOverride = isCombo ? null : (selectedFlavorObj && selectedFlavorObj.price != null
      ? selectedFlavorObj.price
      : (!s.flavor && minFlavorPrice != null ? minFlavorPrice : null));
    const optList = open ? this.optsOf(open, flavorPriceOverride) : [];
    const optIdx = Math.min(s.opt, Math.max(0, optList.length - 1));
    const opts = optList.map((o, i) => ({
      label: o.label, each: o.each, priceLabel: fmt(o.price),
      dotStyle: 'width:18px;height:18px;flex:none;border-radius:50%;box-sizing:border-box;' + (i === optIdx
        ? 'border:5px solid var(--color-accent)'
        : 'border:1px solid var(--line)'),
      onPick: () => this.setState({ opt: i })
    }));
    const unit = open ? this.unitOf(open, s.sel, optIdx, flavorPriceOverride) : 0;
    const flavorOpts = flavorList.map(f => ({
      name: f.name + (f.price != null ? ' · ' + fmt(f.price) : '') + (f.out ? ' (esgotado)' : ''),
      style: pill + 'font-size:12.5px;' + (f.out ? offSt + ';opacity:.4;cursor:not-allowed;text-decoration:line-through' : (s.flavor === f.name ? onSt : offSt)),
      onPick: f.out ? (e => { if (e && e.stopPropagation) e.stopPropagation(); }) : () => this.setState({ flavor: f.name })
    }));
    /* hasFlavors precisa existir como variável de verdade (não só como chave
       do objeto de retorno lá embaixo) — addToCart e sheetA/sheetB
       referenciam ela diretamente, fora de qualquer objeto literal. */
    const hasFlavors = flavorOpts.length > 0;
    const isSingleFlavorMode = hasFlavors && !isCombo;

    /* Segundo grupo de variante, independente do primeiro (ex: produto tem
       SABOR e também COR pra escolher, cada um com seu próprio título) —
       sempre escolha única, sem preço próprio nem modo combo, pra manter
       simples (isso é o "sabor"/"cor" clássico, não o combo de quantidade). */
    const flavorList2 = ((open && open.flavors2) || []).map(f => typeof f === 'string'
      ? { name: f, out: false }
      : { name: (f && f.name) || '', out: !!(f && f.out) });
    const flavorOpts2 = flavorList2.map(f => ({
      name: f.name + (f.out ? ' (esgotado)' : ''),
      style: pill + 'font-size:12.5px;' + (f.out ? offSt + ';opacity:.4;cursor:not-allowed;text-decoration:line-through' : (s.flavor2 === f.name ? onSt : offSt)),
      onPick: f.out ? (e => { if (e && e.stopPropagation) e.stopPropagation(); }) : () => this.setState({ flavor2: f.name })
    }));
    const hasFlavors2 = flavorOpts2.length > 0;
    const variantLabel2 = (open && open.variantLabel2) || 'Escolha a opção';

    const flavorMix = s.flavorMix || {};
    const comboTotal = flavorList.reduce((t, f) => t + (flavorMix[f.name] || 0), 0);
    const comboRemaining = comboQty - comboTotal;
    const comboHint = isCombo ? ('Escolha ' + comboQty + ' no total (' + comboTotal + ' de ' + comboQty + ')') : '';
    /* "Grupo" junta vários sabores numa cota comum (ex: todo sabor de whisky
       leva group:"Whisky" e pelo menos um deles tem groupMax:1) — o efetivo
       é o MENOR groupMax cadastrado no grupo, então o admin só precisa
       preencher em um sabor pra travar o grupo inteiro. */
    const groupCaps = {};
    flavorList.forEach(f => {
      if (f.group && f.groupMax != null) {
        groupCaps[f.group] = groupCaps[f.group] != null ? Math.min(groupCaps[f.group], f.groupMax) : f.groupMax;
      }
    });
    const groupSums = {};
    flavorList.forEach(f => {
      if (f.group) groupSums[f.group] = (groupSums[f.group] || 0) + (flavorMix[f.name] || 0);
    });
    const comboRows = flavorList.map(f => {
      const qty = flavorMix[f.name] || 0;
      const perFlavorCapped = f.max != null && qty >= f.max;
      const groupCap = f.group ? groupCaps[f.group] : null;
      const groupCapped = groupCap != null && (groupSums[f.group] || 0) >= groupCap;
      const incBlocked = f.out || comboRemaining <= 0 || perFlavorCapped || groupCapped;
      return {
        name: f.name + (f.max != null ? ' (máx ' + f.max + ')' : '') + (f.out ? ' (esgotado)' : ''),
        qty: qty,
        incStyle: incBlocked ? 'opacity:.35;cursor:not-allowed' : '',
        onInc: incBlocked
          ? () => this.showToast(f.out ? 'Esse sabor está esgotado.'
              : perFlavorCapped ? ('Esse sabor só pode até ' + f.max + ' nesse combo.')
              : groupCapped ? ('Só pode até ' + groupCap + ' de ' + f.group + ' no total nesse combo.')
              : ('Esse combo já tem os ' + comboQty + ' escolhidos — tire de um sabor pra trocar por outro.'))
          : () => this.setState(st => { const mix = Object.assign({}, st.flavorMix); mix[f.name] = (mix[f.name] || 0) + 1; return { flavorMix: mix }; }),
        onDec: () => this.setState(st => { const mix = Object.assign({}, st.flavorMix); mix[f.name] = Math.max(0, (mix[f.name] || 0) - 1); return { flavorMix: mix }; })
      };
    });
    /* Um só booleano cobre as duas travas do botão "Adicionar": sabor único
       sem nada escolhido, ou combo sem bater a quantidade exata. */
    /* s.flavor === '' (sabor cadastrado sem nome) é uma escolha válida — só
       null conta como "nada escolhido ainda". Comparar com !s.flavor travava
       o botão pra sempre se um sabor ficasse sem nome no painel. */
    const flavorIncomplete = (isCombo ? (comboTotal !== comboQty) : (hasFlavors && s.flavor == null))
      || (hasFlavors2 && s.flavor2 == null);

    const lines = s.cart.map((l, i) => ({
      name: l.name, qty: l.qty, qtyLabel: l.qty + 'x', totalLabel: fmt(l.unit * l.qty),
      photoUrl: l.photo || '', slotId: 'vn-cart-' + (l.pid || i) + '-' + i,
      detail: [l.extras.length ? '+ ' + l.extras.join(', ') : null, l.obs ? '“' + l.obs + '”' : null, fmt(l.unit) + ' cada'].filter(Boolean).join(' · '),
      onInc: () => this.bumpLine(i, 1), onDec: () => this.bumpLine(i, -1),
      onRemove: () => this.setState(st => ({ cart: st.cart.filter((x, j) => j !== i) }))
    }));
    const subtotal = s.cart.reduce((t, l) => t + l.unit * l.qty, 0);
    const count = s.cart.reduce((t, l) => t + l.qty, 0);
    const isEntrega = s.mode === 'entrega';

    const couponCode = String(cfg.couponCode || '').trim();
    const hasCoupon = !!cfg.couponActive && !!couponCode;
    const couponInput = (s.coupon || '').trim();
    const couponMatch = hasCoupon && couponInput && couponInput.toUpperCase() === couponCode.toUpperCase();
    const couponPhoneDigits = s.telefone.replace(/\D/g, '');
    const couponNeedsPhone = couponMatch && couponPhoneDigits.length < 10;
    if (couponMatch && !couponNeedsPhone) this.scheduleCouponCheck(s.telefone, couponCode);
    if (s.referralOpen) this.scheduleReferralCount(s.telefone);
    const referralMilestones = [1, 5, 10, 25]
      .map(n => ({ n: n, reward: (cfg['referralMilestone' + n] || '').trim() }))

          }
        });
        s.cart.forEach(l => VN.track('sale', { product: l.name, qty: l.qty, total: l.unit * l.qty, detail: { orderKey: orderKey } }));
      },
      reset: () => { this._waTracking = false; this.setState({ done: false, cart: [], nome: '', telefone: '', cep: '', rua: '', numero: '', bairro: '', cepStatus: 'idle', addrEdit: false, msg: '', coupon: '', couponRedeemed: false, waTracked: false, deliveryKm: null, deliveryFeeCalc: null, deliveryCalcStatus: 'idle', confirmedTotal: null }); }
    };
  }
}

</script>
